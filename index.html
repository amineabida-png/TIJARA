<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tijara — Gestion Commerciale Maroc</title>
<style>
:root{
  --ink:#16211F; --muted:#5C6B67; --bg:#F2F4F3; --panel:#FFFFFF; --line:#DFE6E3;
  --teal:#0C4A46; --teal-deep:#07322F; --teal-soft:#E3EEEC;
  --saffron:#D9922E; --saffron-soft:#FBF0DD;
  --green:#1E7A4E; --green-soft:#E2F2E9;
  --red:#B7362C; --red-soft:#F9E7E4;
  --blue:#22577A; --blue-soft:#E4EEF5;
  --radius:10px;
  --shadow:0 1px 2px rgba(12,74,70,.06), 0 4px 14px rgba(12,74,70,.07);
}
*{box-sizing:border-box; margin:0; padding:0}
html{font-size:15px}
body{
  font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif;
  background:var(--bg); color:var(--ink); min-height:100vh;
}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit; font-size:.94rem; color:var(--ink)}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:232px; flex-shrink:0; background:var(--teal); color:#EAF3F1;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{
  padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.12);
  background:
    linear-gradient(rgba(7,50,47,.35), rgba(7,50,47,.35)),
    repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 10px, transparent 10px 20px),
    var(--teal-deep);
}
.brand h1{font-size:1.25rem; letter-spacing:.4px; font-weight:700}
.brand h1 span{color:var(--saffron)}
.brand p{font-size:.72rem; color:#B9D0CC; margin-top:3px; letter-spacing:.6px; text-transform:uppercase}
.nav{flex:1; overflow-y:auto; padding:10px 0}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%;
  background:none; border:none; color:#CFE0DD; text-align:left;
  padding:10px 18px; font-size:.93rem; border-left:3px solid transparent;
}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.active{background:rgba(255,255,255,.1); color:#fff; border-left-color:var(--saffron); font-weight:600}
.nav .sep{font-size:.68rem; letter-spacing:1px; text-transform:uppercase; color:#7FA39E; padding:14px 18px 4px}
.nav .ico{width:20px; text-align:center; font-size:1rem}
.side-foot{padding:12px 18px; font-size:.72rem; color:#8FB0AB; border-top:1px solid rgba(255,255,255,.12)}

.main{flex:1; min-width:0; padding:24px 28px 60px}
.page-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.page-head h2{font-size:1.35rem; font-weight:700}
.page-head .sub{font-size:.85rem; color:var(--muted); margin-top:2px}

/* ---------- Components ---------- */
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:8px 14px; border-radius:8px; font-size:.88rem; font-weight:600;
  display:inline-flex; align-items:center; gap:6px;
}
.btn:hover{border-color:#B9C7C3; background:#FAFBFB}
.btn-primary{background:var(--teal); border-color:var(--teal); color:#fff}
.btn-primary:hover{background:var(--teal-deep); border-color:var(--teal-deep)}
.btn-accent{background:var(--saffron); border-color:var(--saffron); color:#fff}
.btn-accent:hover{filter:brightness(.94)}
.btn-danger{color:var(--red); border-color:#EAC5C0}
.btn-danger:hover{background:var(--red-soft)}
.btn-sm{padding:4px 9px; font-size:.8rem; border-radius:6px}
.btn-ghost{border:none; background:none; padding:4px 7px}
.btn-ghost:hover{background:var(--teal-soft); border-radius:6px}

.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto}
.card-pad{padding:18px}
.card h3{font-size:.95rem; margin-bottom:12px}

.toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px}
.toolbar input[type=search], .toolbar select{
  padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; min-width:220px;
}
.toolbar select{min-width:160px}

table.list{width:100%; border-collapse:collapse; font-size:.9rem}
table.list th{
  text-align:left; font-size:.72rem; text-transform:uppercase; letter-spacing:.6px;
  color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line); background:#FAFBFB;
}
table.list td{padding:10px 12px; border-bottom:1px solid #ECF0EE; vertical-align:middle}
table.list tr:last-child td{border-bottom:none}
table.list tr:hover td{background:#F7FAF9}
td.num, th.num{text-align:right; font-variant-numeric:tabular-nums}
td.actions{text-align:right; white-space:nowrap}
.empty{padding:34px; text-align:center; color:var(--muted); font-size:.9rem}

.badge{display:inline-block; padding:3px 9px; border-radius:99px; font-size:.74rem; font-weight:700; letter-spacing:.2px}
.b-green{background:var(--green-soft); color:var(--green)}
.b-red{background:var(--red-soft); color:var(--red)}
.b-amber{background:var(--saffron-soft); color:#9A6410}
.b-blue{background:var(--blue-soft); color:var(--blue)}
.b-gray{background:#EDF0EF; color:var(--muted)}

/* ---------- Dashboard ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:18px}
.stat{padding:16px 18px}
.stat .lbl{font-size:.74rem; text-transform:uppercase; letter-spacing:.7px; color:var(--muted)}
.stat .val{font-size:1.45rem; font-weight:800; margin-top:6px; font-variant-numeric:tabular-nums}
.stat .hint{font-size:.76rem; color:var(--muted); margin-top:4px}
.stat.accent{border-top:3px solid var(--saffron)}
.stat.good{border-top:3px solid var(--green)}
.stat.bad{border-top:3px solid var(--red)}
.stat.info{border-top:3px solid var(--blue)}
.dash-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:14px; align-items:start}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.chart{display:flex; align-items:flex-end; gap:8px; height:170px; padding:6px 4px 0}
.chart .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:5px; height:100%}
.chart .bar i{display:block; width:100%; max-width:44px; background:linear-gradient(180deg,#12615C,var(--teal)); border-radius:5px 5px 0 0; min-height:2px}
.chart .bar b{font-size:.68rem; color:var(--muted); font-weight:600}
.chart .bar .v{font-size:.66rem; color:var(--teal); font-weight:700; font-variant-numeric:tabular-nums}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(10,35,33,.45); display:none;
  align-items:flex-start; justify-content:center; padding:30px 16px; z-index:225; overflow-y:auto;
}
.overlay.open{display:flex}
.modal{background:#fff; border-radius:12px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.25); animation:pop .18s ease}
.modal.wide{max-width:980px}
@keyframes pop{from{transform:translateY(8px); opacity:0} to{transform:none; opacity:1}}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line)}
.modal-head h3{font-size:1.05rem}
.modal-body{padding:20px; overflow-x:auto}
.modal-foot{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap}
.x{border:none; background:none; font-size:1.3rem; color:var(--muted); line-height:1}
.x:hover{color:var(--ink)}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:.78rem; font-weight:700; color:#3E4C49}
.field input,.field select,.field textarea{
  padding:8px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(12,74,70,.25); border-color:var(--teal)}
.field .req{color:var(--red)}

/* ---------- Éditeur de document ---------- */
table.lines{width:100%; border-collapse:collapse; font-size:.87rem; margin-top:6px}
table.lines th{font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); text-align:left; padding:6px; border-bottom:1px solid var(--line)}
table.lines td{padding:5px 4px; border-bottom:1px solid #F0F3F2; vertical-align:middle}
table.lines input, table.lines select{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px}
table.lines td.ln-total{text-align:right; font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; padding-right:8px}
.totaux{margin-top:14px; margin-left:auto; width:320px; max-width:100%; font-size:.92rem}
.totaux .row{display:flex; justify-content:space-between; padding:5px 4px}
.totaux .row.grand{border-top:2px solid var(--ink); margin-top:6px; padding-top:9px; font-weight:800; font-size:1.05rem}
.totaux .row span:last-child{font-variant-numeric:tabular-nums}

/* ---------- Toast ---------- */
#toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:10px 20px; border-radius:99px; font-size:.88rem;
  opacity:0; pointer-events:none; transition:.25s; z-index:230; box-shadow:0 8px 24px rgba(0,0,0,.25);
}
#toast.show{opacity:1; transform:translateX(-50%)}
#toast.err{background:var(--red)}
#syncIndic{
  position:fixed; top:10px; right:14px; z-index:90; font-size:.72rem; color:var(--muted);
  background:rgba(255,255,255,.9); padding:4px 10px; border-radius:99px; border:1px solid var(--line);
  pointer-events:none;
}
@media(max-width:560px){#syncIndic{top:auto; bottom:14px; right:10px; font-size:.68rem}}

.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{border:1px solid var(--line); background:#fff; padding:7px 16px; border-radius:99px; font-size:.85rem; font-weight:600; color:var(--muted)}
.tabs button:hover{border-color:#B9C7C3}
.tabs button.active{background:var(--teal); border-color:var(--teal); color:#fff}
.chips{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.chip{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 14px; font-size:.78rem; color:var(--muted)}
.chip b{display:block; font-size:.98rem; color:var(--ink); margin-top:2px; font-variant-numeric:tabular-nums}

/* ---------- Rendu des documents imprimables ---------- */
#printArea{display:none}
@media print{
  @page{size:A4; margin:4mm 6mm}
  body{background:#fff}
  /* Sans ça, iOS Safari et Chrome Android n'impriment pas les couleurs de
     fond (contrairement à Windows) : les en-têtes de tableau et le total
     passent en texte blanc sur fond blanc, donc invisibles. */
  *{-webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important}
  .app, #toast, #syncIndic, .overlay{display:none !important}
  #printArea{display:block}
  /* Marge de sécurité indépendante du réglage "Marges" du navigateur : même sur
     "Aucune"/"Minimale" (qui ignore @page), le contenu garde un espace au bord.
     Largeur posée en mm (unité physique, absolue) plutôt qu'en % : sur
     iOS/Android, le rendu d'impression met en page selon la largeur d'écran
     du téléphone et non celle du papier — un % de cette largeur-écran reste
     minuscule (d'où la colonne « Désignation » écrasée mot par mot). Le mm
     correspond toujours à sa vraie taille physique, quel que soit l'appareil. */
  .doc{min-height:calc(100vh - 3mm); max-width:none; width:198mm; padding:6mm 8mm}
}
.doc{font-family:"Segoe UI", Arial, sans-serif; color:#111; font-size:12.5px; max-width:800px; margin:0 auto; padding:10px 0; display:flex; flex-direction:column; min-height:96vh}
.doc-head{display:flex; justify-content:space-between; gap:20px; border-bottom:3px solid var(--teal); padding-bottom:14px}
.doc-head .soc h1{font-size:20px; color:var(--teal); letter-spacing:.3px}
.doc-head .soc p{font-size:11.5px; color:#333; margin-top:2px}
.doc-title{text-align:right}
.doc-title h2{font-size:22px; color:var(--teal); text-transform:uppercase; letter-spacing:1px}
.doc-title p{font-size:12px; margin-top:3px}
.doc-meta{display:flex; justify-content:space-between; gap:20px; margin:16px 0}
.doc-meta .blk{border:1px solid #CBD5D2; border-radius:8px; padding:10px 14px; min-width:250px}
.doc-meta .blk .t{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--teal); font-weight:700; margin-bottom:5px}
.doc-meta .blk p{font-size:12px; margin:1.5px 0}
/* table-layout:fixed — Safari/iOS calcule autrement la largeur des colonnes
   sans largeur explicite (« Désignation ») que Chrome/Edge : sans ça, la
   colonne s'écrase en bande étroite et le texte s'empile mot par mot. En
   layout fixe, la première ligne (largeurs des th) fait foi partout, et
   « Désignation » récupère simplement tout l'espace restant. */
table.doc-lines{width:100%; border-collapse:collapse; margin-top:6px; font-size:12px; table-layout:fixed}
table.doc-lines th{background:var(--teal); color:#fff; padding:7px 9px; text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px}
table.doc-lines td{padding:7px 9px; border-bottom:1px solid #DDE4E2; word-wrap:break-word; overflow-wrap:break-word}
table.doc-lines .num{text-align:right; font-variant-numeric:tabular-nums}
.doc-tot{margin-left:auto; width:300px; margin-top:12px; font-size:12.5px}
.doc-tot .row{display:flex; justify-content:space-between; padding:4px 8px}
.doc-tot .row.grand{background:var(--teal); color:#fff; font-weight:800; border-radius:6px; padding:8px; font-size:14px; margin-top:4px}
.doc-lettres{margin-top:14px; border:1px solid #CBD5D2; border-left:4px solid var(--saffron); border-radius:6px; padding:9px 13px; font-size:12px; font-style:italic}
.doc-notes{margin-top:12px; font-size:11.5px; color:#333; white-space:pre-wrap}
.doc-sign{display:flex; justify-content:space-between; margin-top:34px; font-size:12px}
.doc-sign div{width:260px; text-align:center}
.doc-sign .l{border-top:1px solid #999; margin-top:55px; padding-top:5px; color:#555}
.doc-foot{margin-top:auto; border-top:2px solid var(--teal); padding-top:5px; text-align:center; font-size:10px; color:#444; line-height:1.5}
@media(max-width:900px){
  .sidebar{width:64px}
  .sidebar .brand h1, .sidebar .brand p, .nav button span.txt, .nav .sep, .side-foot{display:none}
  .nav button{justify-content:center; padding:12px 0}
  .main{padding:16px}
}
#hamburger{display:none}
#sidebarBackdrop{display:none}
@media(max-width:560px){
  #hamburger{
    display:flex; align-items:center; justify-content:center; position:fixed; top:10px; left:10px; z-index:220;
    width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink);
    font-size:1.15rem; box-shadow:var(--shadow);
  }
  .sidebar{
    position:fixed; inset:0 auto 0 0; width:240px; z-index:210; transform:translateX(-100%);
    transition:transform .22s ease; box-shadow:0 0 0 rgba(0,0,0,0);
  }
  .sidebar.open{transform:translateX(0); box-shadow:8px 0 30px rgba(0,0,0,.25)}
  .sidebar .brand h1, .sidebar .brand p, .nav button span.txt, .nav .sep, .side-foot{display:block}
  .nav button{justify-content:flex-start; padding:10px 18px}
  #sidebarBackdrop.open{
    display:block; position:fixed; inset:0; background:rgba(10,35,33,.45); z-index:200;
  }
  .main{padding:54px 14px 40px}
  .page-head{flex-direction:column; align-items:flex-start}
  .modal{max-width:100%}
  .overlay{padding:0}
  .modal, .modal.wide{border-radius:0; min-height:100vh}
  table.list{font-size:.82rem}
  /* Tableau de lignes de document : garder une largeur lisible et défiler
     horizontalement plutôt que d'écraser les colonnes jusqu'à l'illisible. */
  table.lines{min-width:640px}
}
@media print{ #hamburger, #sidebarBackdrop{display:none !important} }
.pos{display:grid; grid-template-columns:1.45fr 1fr; gap:14px; align-items:start}
@media(max-width:1000px){.pos{grid-template-columns:1fr}}
.pos-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; max-height:62vh; overflow-y:auto; padding:2px}
.pos-grid button{border:1px solid var(--line); background:#fff; border-radius:10px; padding:10px 8px; text-align:center; font-size:.82rem; line-height:1.3}
.pos-grid button:hover{border-color:var(--teal); background:var(--teal-soft)}
.pos-grid button b{display:block; color:var(--teal); margin-top:4px}
.pos-grid button small{display:block; margin-top:2px}
.pos-total{font-size:1.7rem; font-weight:800; text-align:right; padding:12px 4px 6px; font-variant-numeric:tabular-nums; color:var(--teal)}
.ticket{font-family:'Courier New', monospace; width:270px; margin:0 auto; font-size:12px; color:#000; padding:10px 0}
.ticket h3{text-align:center; font-size:14px; margin-bottom:4px}
.ticket p{margin:2px 0}
.ticket .c{text-align:center}
.ticket .r{text-align:right}
.ticket table{width:100%; border-collapse:collapse}
.ticket td{padding:2px 0; vertical-align:top}
.ticket .sep2{border-top:1px dashed #000; margin:6px 0}
#lockScreen{position:fixed; inset:0; background:var(--teal-deep); display:none; align-items:center; justify-content:center; z-index:300}
.lock-card{background:var(--teal); border:1px solid rgba(255,255,255,.15); border-radius:14px; padding:34px 30px; width:320px; text-align:center; color:#EAF3F1}
.lock-card h1{font-size:1.6rem; margin-bottom:4px}
.lock-card p{font-size:.8rem; color:#B9D0CC; margin-bottom:16px}
.lock-card input{width:100%; padding:11px 14px; border-radius:8px; border:none; margin-bottom:12px; text-align:center; font-size:1rem}
.doc.paged{min-height:auto; padding:0}
.page{display:flex; flex-direction:column; min-height:96vh; padding:10px 0; page-break-after:always; break-after:page}
.page:last-child{page-break-after:auto; break-after:auto}
.doc-title p.pagenum{font-size:10px; color:#777; margin-top:6px}
@media print{
  .page{min-height:calc(100vh - 3mm); padding:6mm 8mm}
  table.doc-lines{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <button id="hamburger" onclick="toggleSidebar()" aria-label="Menu">☰</button>
  <div id="sidebarBackdrop" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar">
    <div class="brand">
      <h1>Tijara<span>.</span></h1>
      <p>Gestion commerciale</p>
    </div>
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active"><span class="ico">◧</span><span class="txt">Tableau de bord</span></button>
      <div class="sep">Ventes</div>
      <button data-view="devis"><span class="ico">✎</span><span class="txt">Devis</span></button>
      <button data-view="proformas"><span class="ico">≋</span><span class="txt">Proformas</span></button>
      <button data-view="commandes"><span class="ico">☑</span><span class="txt">Commandes clients</span></button>
      <button data-view="factures"><span class="ico">▤</span><span class="txt">Factures</span></button>
      <button data-view="avoirs"><span class="ico">↩</span><span class="txt">Avoirs</span></button>
      <button data-view="retours"><span class="ico">⟲</span><span class="txt">Retours clients</span></button>
      <button data-view="bl"><span class="ico">⇥</span><span class="txt">Bons de livraison</span></button>
      <button data-view="reglements"><span class="ico">◈</span><span class="txt">Règlements</span></button>
      <div class="sep">Achats</div>
      <button data-view="bc"><span class="ico">⇤</span><span class="txt">Bons de commande</span></button>
      <button data-view="fachats"><span class="ico">▥</span><span class="txt">Factures d'achat</span></button>
      <button data-view="retoursF"><span class="ico">⟳</span><span class="txt">Retours fournisseurs</span></button>
      <div class="sep">Caisse &amp; finances</div>
      <button data-view="caisse"><span class="ico">⌸</span><span class="txt">Caisse (POS)</span></button>
      <button data-view="charges"><span class="ico">▽</span><span class="txt">Charges</span></button>
      <button data-view="tresorerie"><span class="ico">◨</span><span class="txt">Trésorerie</span></button>
      <button data-view="paie"><span class="ico">⛊</span><span class="txt">Paie (RH)</span></button>
      <div class="sep">Analyse</div>
      <button data-view="echeancier"><span class="ico">◷</span><span class="txt">Échéancier</span></button>
      <button data-view="rapports"><span class="ico">◫</span><span class="txt">Rapports</span></button>
      <div class="sep">Données</div>
      <button data-view="clients"><span class="ico">☰</span><span class="txt">Clients</span></button>
      <button data-view="fournisseurs"><span class="ico">⌂</span><span class="txt">Fournisseurs</span></button>
      <button data-view="produits"><span class="ico">▦</span><span class="txt">Produits &amp; stock</span></button>
      <div class="sep">Système</div>

/* ---------- Impression mobile : bug de viewport iOS/Android ---------- */
/* Sur iPhone/Android, window.print() met en page le document imprimé en
   utilisant la largeur de l'écran du téléphone (via <meta viewport
   width=device-width>) au lieu de la largeur réelle de la page A4. Résultat :
   les colonnes fixes (Qté, PU, TVA…) occupent presque toute cette largeur
   minuscule et écrasent la colonne « Désignation » à quelques pixels — le
   texte revient à la ligne mot par mot et le document déborde sur plusieurs
   pages, alors que Windows met déjà en page à la largeur réelle du papier.
   On élargit temporairement le viewport le temps de l'impression pour que
   la mise en page se calcule sur une largeur proche de celle du papier. */
(function(){
  const vp = document.querySelector('meta[name="viewport"]');
  if (!vp) return;
  const original = vp.getAttribute('content');
  const widen = () => vp.setAttribute('content', 'width=1024');
  const restore = () => vp.setAttribute('content', original);
  window.addEventListener('beforeprint', widen);
  window.addEventListener('afterprint', restore);
})();

function migrate(data){
  const d = Object.assign(defaultDB(), data||{});

  d.societe.docStyle = Object.assign({couleur:'#0C4A46', accent:'#D9922E', police:'Segoe UI'}, ((data||{}).societe||{}).docStyle||{});

    if(!p.stocks){ p.stocks = {}; p.stocks[d0] = Number(p.stock)||0; }
    p.stock = r2(Object.values(p.stocks).reduce((a,b)=>a+(Number(b)||0),0));
  });
  if(!Array.isArray(d.comptes) || !d.comptes.length)
    d.comptes = [{id:'cpt-caisse', nom:'Caisse', type:'caisse', soldeInitial:0},{id:'cpt-banque', nom:'Banque principale', type:'banque', soldeInitial:0}];
  d.securite = Object.assign({actif:false, admin:'', vendeur:''}, d.securite||{});

  const cptC = (d.comptes.find(c=>c.type==='caisse')||d.comptes[0]).id;
  const cptB = (d.comptes.find(c=>c.type==='banque')||d.comptes[0]).id;
  [d.reglements, d.reglementsF].forEach(arr=> (arr||[]).forEach(r=>{
    if(!r.compteId) r.compteId = /Espèces/.test(r.mode||'') ? cptC : cptB;
  }));
  return d;
}

/* ---------- Stock multi-dépôts ---------- */
function setStock(p, depotId, delta){
  if(!p.stocks) p.stocks = {};
  p.stocks[depotId] = r2((Number(p.stocks[depotId])||0) + delta);
  p.stock = r2(Object.values(p.stocks).reduce((a,b)=>a+(Number(b)||0),0));
}
function appliquerStock(lignes, sens, depotId){ // -1 : sortie · +1 : entrée
  const dep = depotId && depotById(depotId) ? depotId : DB.depots[0].id;
  (lignes||[]).forEach(l=>{
    const p = produitById(l.produitId);
    if(p) setStock(p, dep, sens*(Number(l.qte)||0));
  });
}

/* ---------- Calculs ---------- */
function calcDoc(doc){
  let ht=0, remise=0; const tvaMap={};
  (doc.lignes||[]).forEach(l=>{
    const brut = r2((Number(l.qte)||0) * (Number(l.pu)||0));
    const rem  = r2(brut * (Number(l.remise)||0) / 100);
    const net  = r2(brut - rem);
    ht += net; remise += rem;
    const tx = Number(l.tva)||0;
    tvaMap[tx] = r2((tvaMap[tx]||0) + net * tx/100);
  });
  ht = r2(ht);
  const tva = r2(Object.values(tvaMap).reduce((a,b)=>a+b,0));
  return { ht, remise:r2(remise), tvaMap, tva, ttc: r2(ht+tva) };
}
const rasMontant = f => r2(calcDoc(f).ttc * (Number(f.rasTaux)||0)/100);
function totalRegle(factureId){
  return r2(DB.reglements.filter(r=>r.factureId===factureId && r.statut!=='impayé').reduce((a,r)=>a+(Number(r.montant)||0),0));
}
function totalRegleF(factureId){
  return r2(DB.reglementsF.filter(r=>r.factureId===factureId && r.statut!=='impayé').reduce((a,r)=>a+(Number(r.montant)||0),0));
}
function totalAvoirs(factureId){
  return r2(DB.avoirs.filter(a=>a.origineId===factureId).reduce((s,a)=>s+calcDoc(a).ttc,0));
}
function resteFacture(f){
  return r2(Math.max(0, calcDoc(f).ttc - totalRegle(f.id) - totalAvoirs(f.id) - rasMontant(f)));
}
function resteFachat(f){
  return r2(Math.max(0, calcDoc(f).ttc - totalRegleF(f.id)));
}
function statutFacture(f){
  const ttc = calcDoc(f).ttc, credit = totalRegle(f.id) + totalAvoirs(f.id) + rasMontant(f);
  if(ttc - credit <= 0.004) return {code:'payee', lbl:'Soldée', cls:'b-green'};
  if(credit <= 0.004) return {code:'impayee', lbl:'Impayée', cls:'b-red'};
  return {code:'partielle', lbl:'Partielle', cls:'b-amber'};
}
function statutFachat(f){
  const ttc = calcDoc(f).ttc, paye = totalRegleF(f.id);
  if(ttc - paye <= 0.004) return {code:'payee', lbl:'Payée', cls:'b-green'};
  if(paye <= 0.004) return {code:'impayee', lbl:'À payer', cls:'b-red'};
  return {code:'partielle', lbl:'Partielle', cls:'b-amber'};
}

/* ---------- Montant en lettres (français) ---------- */
const U19 = ['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
const DIZ = ['','dix','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
function deuxChiffres(n){
  if(n < 20) return U19[n];
  const d = Math.floor(n/10), u = n % 10;
  if(d === 7 || d === 9){
    if(d === 7 && u === 1) return 'soixante et onze';
    return DIZ[d] + '-' + U19[10+u];
  }
  if(u === 0) return DIZ[d] + (d === 8 ? 's' : '');
  if(u === 1 && d !== 8) return DIZ[d] + ' et un';
  return DIZ[d] + '-' + U19[u];
}
function troisChiffres(n){
  const c = Math.floor(n/100), r = n % 100;
  let s = '';
  if(c > 0){
    s = (c > 1 ? U19[c] + ' ' : '') + 'cent' + (c > 1 && r === 0 ? 's' : '');
    if(r > 0) s += ' ';
  }
  if(r > 0 || n === 0) s += deuxChiffres(r);
  return s;
}
function enLettres(n){
  n = Math.floor(Math.abs(n));
  if(n === 0) return 'zéro';
  const parts = [];
  for(const [div,s1,s2] of [[1000000000,'milliard','milliards'],[1000000,'million','millions']]){
    if(n >= div){
      const q = Math.floor(n/div);
      parts.push(troisChiffres(q) + ' ' + (q > 1 ? s2 : s1));
      n %= div;
    }
  }
  if(n >= 1000){
    const q = Math.floor(n/1000);
    parts.push(q === 1 ? 'mille' : troisChiffres(q).replace(/(cent|vingt)s$/, '$1') + ' mille');
    n %= 1000;
  }
  if(n > 0) parts.push(troisChiffres(n));
  return parts.join(' ');
}
function montantEnLettres(m){
  m = r2(Math.abs(m));
  const dh = Math.floor(m), c = Math.round((m - dh)*100);
  let s = enLettres(dh) + ' dirham' + (dh > 1 ? 's' : '');
  if(c > 0) s += ' et ' + enLettres(c) + ' centime' + (c > 1 ? 's' : '');
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function vDashboard(){

    <div class="card stat accent"><div class="lbl">À payer fournisseurs</div><div class="val">${fmtDH(aPayer)}</div><div class="hint">${devisAttente} devis en attente · ${bcEnCours} BC en cours</div></div>
  </div>

      </div>
      <div class="card card-pad">
        <h3>Dernières factures</h3>

          <tr><td><b>${esc(f.numero)}</b><br><small style="color:var(--muted)">${esc(clientById(f.clientId)?.nom||'—')}</small></td>

function saveTiers(type, id){
  const nom = $('#t_nom').value.trim();
  if(!nom) return toast('Le nom est obligatoire.', true);
  const ice = $('#t_ice').value.trim();
  if(ice && !/^\d{15}$/.test(ice)) return toast('L\u2019ICE doit comporter exactement 15 chiffres.', true);
  const o = { nom, ice, idf:$('#t_if').value.trim(), adresse:$('#t_adr').value.trim(), ville:$('#t_ville').value.trim(),
    tel:$('#t_tel').value.trim(), email:$('#t_email').value.trim(), rc:$('#t_rc').value.trim() };
  if(id){ Object.assign(DB[type].find(x=>x.id===id), o); }
  else { o.id = uid(); DB[type].push(o); }
  saveDB(); closeModal(); render(); toast('Enregistré ✓');
}
function delTiers(type, id){
  if(type==='clients' && ['factures','devis','proformas','avoirs','bl','commandes','retours'].some(t=>DB[t].some(d=>d.clientId===id)))
    return toast('Impossible : des documents sont liés à ce client.', true);
  if(type==='fournisseurs' && (DB.bc.some(b=>b.clientId===id) || DB.fachats.some(f=>f.clientId===id) || DB.retoursF.some(f=>f.clientId===id)))
    return toast('Impossible : des documents d\u2019achat sont liés à ce fournisseur.', true);
  if(!confirm('Supprimer définitivement ?')) return;
  DB[type] = DB[type].filter(x=>x.id!==id);
  saveDB(); render(); toast('Supprimé');
}

function saveProduit(id){
  const des = $('#p_des').value.trim();
  const pv = parseFloat($('#p_pv').value);
  if(!des) return toast('La désignation est obligatoire.', true);
  if(isNaN(pv) || pv < 0) return toast('Prix de vente invalide.', true);
  const stocks = {};
  document.querySelectorAll('.p_stk').forEach(i=> stocks[i.dataset.dep] = parseFloat(i.value)||0);
  const o = { ref:$('#p_ref').value.trim(), codeBarres:$('#p_cb').value.trim(), designation:des, unite:$('#p_unite').value,
    prixAchat:parseFloat($('#p_pa').value)||0, prixVente:pv, tva:Number($('#p_tva').value),
    stocks, stock:r2(Object.values(stocks).reduce((a,b)=>a+b,0)), stockMin:parseFloat($('#p_min').value)||0 };
  if(id){ Object.assign(produitById(id), o); }
  else { o.id = uid(); DB.produits.push(o); }
  saveDB(); closeModal(); render(); toast('Produit enregistré ✓');
}
function delProduit(id){
  if(!confirm('Supprimer ce produit ? (les documents existants conservent leurs lignes)')) return;
  DB.produits = DB.produits.filter(p=>p.id!==id);
  saveDB(); render(); toast('Produit supprimé');
}
function mvtStock(id){
  const p = produitById(id);
  const depOpts = DB.depots.map(dp=>`<option value="${dp.id}">${esc(dp.nom)}</option>`).join('');
  openModal('Mouvement de stock — ' + p.designation, `
    <div class="grid2">
      <div class="field"><label>Type de mouvement</label>
        <select id="m_type" onchange="$('#m_dest_wrap').style.display = this.value==='tr' ? '' : 'none'">

          ${DB.depots.length>1?'<option value="tr">Transfert entre dépôts</option>':''}
        </select></div>
      <div class="field"><label>Quantité</label><input id="m_qte" type="number" step="0.01" min="0" value="1"></div>
      <div class="field"><label>Dépôt ${DB.depots.length>1?'(source)':''}</label><select id="m_dep">${depOpts}</select></div>
      <div class="field" id="m_dest_wrap" style="display:none"><label>Dépôt de destination</label><select id="m_dest">${depOpts}</select></div>
    </div>
    <p style="margin-top:12px; font-size:.85rem; color:var(--muted)">Stock total : <b>${fmt(p.stock)} ${esc(p.unite||'')}</b>. Les factures sortent du stock, les avoirs et réceptions de commandes y entrent.</p>`,
    `<button class="btn" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="saveMvt('${id}')">Valider</button>`);
}
function saveMvt(id){
  const p = produitById(id);
  const q = parseFloat($('#m_qte').value)||0;
  if(q <= 0) return toast('Quantité invalide.', true);
  const type = $('#m_type').value, dep = $('#m_dep').value;
  if(type==='tr'){
    const dest = $('#m_dest').value;
    if(dest===dep) return toast('Choisissez deux dépôts différents.', true);
    setStock(p, dep, -q); setStock(p, dest, +q);
  } else {
    setStock(p, dep, type==='in' ? q : -q);
  }
  saveDB(); closeModal(); render(); toast('Stock mis à jour ✓');
}

/* ---------- Documents commerciaux (7 types) ---------- */
const DOCLBL = {
  devis:{s:'devis', p:'Devis'},
  proformas:{s:'facture proforma', p:'Factures proforma'},
  factures:{s:'facture', p:'Factures'},
  avoirs:{s:'facture d\u2019avoir', p:'Avoirs (factures d\u2019avoir)'},
  bl:{s:'bon de livraison', p:'Bons de livraison'},
  bc:{s:'bon de commande fournisseur', p:'Bons de commande fournisseur'},
  fachats:{s:'facture d\u2019achat', p:'Factures d\u2019achat (fournisseurs)'},
  commandes:{s:'bon de commande client', p:'Commandes clients'},
  retours:{s:'bon de retour client', p:'Retours clients'},
  retoursF:{s:'bon de retour fournisseur', p:'Retours fournisseurs'}
};
const isAchat = t => t==='bc' || t==='fachats' || t==='retoursF';
const docTiersNom = (type,d) => (isAchat(type) ? fournisseurById(d.clientId) : clientById(d.clientId))?.nom || '—';
let filtreDoc = '', filtreStatut = '';

function badgeDoc(type, d){
  if(type==='factures'){ const s = statutFacture(d); return `<span class="badge ${s.cls}">${s.lbl}</span>`; }
  if(type==='fachats'){ const s = statutFachat(d); return `<span class="badge ${s.cls}">${s.lbl}</span>`; }
  if(type==='devis'){ const cls = {'en attente':'b-amber','accepté':'b-green','refusé':'b-red','facturé':'b-blue'}[d.statut]||'b-gray'; return `<span class="badge ${cls}">${esc(d.statut||'—')}</span>`; }
  if(type==='proformas') return d.statut==='facturé' ? '<span class="badge b-blue">facturée</span>' : '<span class="badge b-gray">proforma</span>';
  if(type==='avoirs') return '<span class="badge b-red">avoir</span>';
  if(type==='commandes'){ const cls = {'en cours':'b-amber','livrée':'b-blue','facturée':'b-green','annulée':'b-gray'}[d.statut]||'b-amber'; return `<span class="badge ${cls}">${esc(d.statut||'en cours')}</span>`; }
  if(type==='retours') return d.statut==='avoir établi' ? '<span class="badge b-blue">avoir établi</span>' : '<span class="badge b-amber">retour client</span>';
  if(type==='retoursF') return '<span class="badge b-amber">retour fournisseur</span>';
  if(type==='bc'){ const st = d.statut||'en cours'; const cls = {'en cours':'b-amber','reçue':'b-green','annulée':'b-gray'}[st]||'b-amber'; return `<span class="badge ${cls}">${esc(st)}</span>`; }
  return '<span class="badge b-blue">livré</span>';
}

function vDocs(type){
  const L = DOCLBL[type], achat = isAchat(type);
  let arr = [...DB[type]].sort((a,b)=> (b.date+b.numero).localeCompare(a.date+a.numero));
  if(filtreDoc) arr = arr.filter(d => (d.numero+' '+(d.origine||'')+' '+docTiersNom(type,d)).toLowerCase().includes(filtreDoc.toLowerCase()));
  if(type==='factures' && filtreStatut) arr = arr.filter(f => statutFacture(f).code===filtreStatut);
  if(type==='fachats' && filtreStatut) arr = arr.filter(f => statutFachat(f).code===filtreStatut);
  if((type==='devis'||type==='bc'||type==='commandes') && filtreStatut) arr = arr.filter(d => (d.statut||'en cours')===filtreStatut);

  const selStat = opts => `<select onchange="filtreStatut=this.value; render()"><option value="">Tous les statuts</option>
    ${opts.map(([v,l])=>`<option value="${v}" ${filtreStatut===v?'selected':''}>${l}</option>`).join('')}</select>`;
  const filtres = type==='factures' ? selStat([['impayee','Impayées'],['partielle','Partielles'],['payee','Soldées']])
    : type==='fachats' ? selStat([['impayee','À payer'],['partielle','Partielles'],['payee','Payées']])
    : type==='devis' ? selStat([['en attente','en attente'],['accepté','accepté'],['refusé','refusé'],['facturé','facturé']])
    : type==='bc' ? selStat([['en cours','en cours'],['reçue','reçue'],['annulée','annulée']])
    : type==='commandes' ? selStat([['en cours','en cours'],['livrée','livrée'],['facturée','facturée'],['annulée','annulée']])
    : '';

  return `
  <div class="page-head"><div><h2>${L.p}</h2><div class="sub">${DB[type].length} document(s)</div></div>
    <button class="btn btn-primary" onclick="editDoc('${type}')">+ Nouveau document</button></div>
  <div class="toolbar">
    <input type="search" placeholder="Rechercher (n°, ${achat?'fournisseur':'client'}, réf.)…" value="${esc(filtreDoc)}" oninput="filtreDoc=this.value; render()">
    ${filtres}
  </div>
  <div class="card">${arr.length ? `
    <table class="list"><thead><tr>
      <th>N°</th><th>Date</th><th>${achat?'Fournisseur':'Client'}</th><th class="num">HT</th><th class="num">TTC</th>
      ${type==='factures'?'<th class="num">Réglé + déductions</th>':''}${type==='fachats'?'<th class="num">Payé</th>':''}<th>Statut</th><th></th></tr></thead><tbody>
    ${arr.map(d=>{
      const c = calcDoc(d), st = d.statut||'en cours';
      let act = `<button class="btn btn-ghost btn-sm" title="Imprimer / PDF" onclick="imprimer('${type}','${d.id}')">🖨</button>`;
      if((type==='devis'||type==='proformas') && d.statut!=='facturé')
        act += `<button class="btn btn-ghost btn-sm" title="Transformer en facture" onclick="docVersFacture('${type}','${d.id}')" style="color:var(--green)">→ FAC</button>`;
      if(type==='commandes' && d.statut!=='facturée' && d.statut!=='annulée')
        act += `<button class="btn btn-ghost btn-sm" title="Facturer la commande" onclick="docVersFacture('commandes','${d.id}')" style="color:var(--green)">→ FAC</button>
        <button class="btn btn-ghost btn-sm" title="Générer le bon de livraison" onclick="commandeVersBL('${d.id}')">→ BL</button>`;
      if(type==='retours' && d.statut!=='avoir établi')
        act += `<button class="btn btn-ghost btn-sm" title="Établir la facture d'avoir" onclick="retourVersAvoir('${d.id}')" style="color:var(--red)">→ AV</button>`;
      if(type==='factures')
        act += `<button class="btn btn-ghost btn-sm" title="Encaisser un règlement" onclick="editReglement('C','${d.id}')" style="color:var(--green)">💰</button>
        <button class="btn btn-ghost btn-sm" title="Générer le bon de livraison" onclick="factureVersBL('${d.id}')">→ BL</button>
        <button class="btn btn-ghost btn-sm" title="Créer une facture d'avoir" onclick="factureVersAvoir('${d.id}')" style="color:var(--red)">→ AV</button>`;
      if(type==='fachats')
        act += `<button class="btn btn-ghost btn-sm" title="Payer le fournisseur" onclick="editReglement('F','${d.id}')" style="color:var(--green)">💰</button>`;
      if(type==='bc' && st==='en cours')
        act += `<button class="btn btn-ghost btn-sm" title="Réceptionner : entrée en stock" onclick="receptionnerBC('${d.id}')" style="color:var(--green)">✓ Réception</button>
        <button class="btn btn-ghost btn-sm" title="Créer la facture d'achat" onclick="bcVersFachat('${d.id}')">→ ACH</button>`;
      if(type==='bc' && st==='reçue')
        act += `<button class="btn btn-ghost btn-sm" title="Créer la facture d'achat" onclick="bcVersFachat('${d.id}')">→ ACH</button>`;
      act += `<button class="btn btn-ghost btn-sm" title="Modifier" onclick="editDoc('${type}','${d.id}')">✎</button>
        <button class="btn btn-ghost btn-sm" title="Supprimer" onclick="delDoc('${type}','${d.id}')" style="color:var(--red)">🗑</button>`;
      return `<tr>
      <td><b>${esc(d.numero)}</b>${d.origine?`<br><small style="color:var(--muted)">réf. ${esc(d.origine)}</small>`:''}</td>
      <td>${dfr(d.date)}</td><td>${esc(docTiersNom(type,d))}</td>
      <td class="num">${fmtDH(c.ht)}</td><td class="num"><b>${fmtDH(c.ttc)}</b></td>
      ${type==='factures'?`<td class="num">${fmtDH(r2(totalRegle(d.id)+totalAvoirs(d.id)+rasMontant(d)))}</td>`:''}
      ${type==='fachats'?`<td class="num">${fmtDH(totalRegleF(d.id))}</td>`:''}
      <td>${badgeDoc(type,d)}</td>
      <td class="actions">${act}</td></tr>`;}).join('')}
    </tbody></table>` : `<div class="empty">Aucun document. Créez-en un avec le bouton ci-dessus.</div>`}
  </div>`;
}

/* --- Éditeur de document --- */
let editLignes = [], editType = 'factures';
function editDoc(type, id){
  const achat = isAchat(type);
  const tiers = achat ? DB.fournisseurs : DB.clients;
  if(!tiers.length){
    toast(achat ? 'Ajoutez d\u2019abord un fournisseur.' : 'Ajoutez d\u2019abord un client.', true);
    currentView = achat ? 'fournisseurs' : 'clients'; syncNav(); render(); return;
  }
  const d = id ? DB[type].find(x=>x.id===id) : null;
  if(type==='bc' && d && (d.statut||'en cours')==='reçue')
    return toast('Cette commande a déjà été réceptionnée (stock mis à jour) : elle n\u2019est plus modifiable.', true);
  editType = type;
  const L = DOCLBL[type];
  editLignes = d ? JSON.parse(JSON.stringify(d.lignes)) : [{produitId:'', designation:'', qte:1, pu:0, remise:0, tva:DB.societe.tvaDefaut ?? 20}];
  const depSel = `<div class="field"><label>Dépôt</label><select id="d_depot">
    ${DB.depots.map(dp=>`<option value="${dp.id}" ${(d?.depotId||DB.depots[0].id)===dp.id?'selected':''}>${esc(dp.nom)}</option>`).join('')}</select></div>`;
  let extra = '';
  if(type==='devis') extra = `
    <div class="field"><label>Statut</label><select id="d_statut">

    </tr></thead><tbody id="lignesBody"></tbody></table>
    <button class="btn btn-sm" style="margin-top:10px" onclick="addLigne()">+ Ajouter une ligne</button>
    <div class="totaux" id="docTotaux"></div>
    <div class="field" style="margin-top:12px"><label>Notes (visibles sur le document imprimé)</label>
      <textarea id="d_notes" rows="2" placeholder="Conditions de paiement, validité, délai de livraison…">${esc(d?.notes||'')}</textarea></div>`,
    `<button class="btn" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="saveDoc('${type}','${id||''}')">Enregistrer</button>`, true);
  renderLignes();
}
function renderLignes(){
  const tb = $('#lignesBody'); if(!tb) return;
  tb.innerHTML = editLignes.map((l,i)=>{
    const brut = (Number(l.qte)||0)*(Number(l.pu)||0);
    const net = r2(brut - brut*(Number(l.remise)||0)/100);
    return `<tr>
    <td><select onchange="pickProduit(${i}, this.value)">
      <option value="">— libre —</option>
      ${DB.produits.map(p=>`<option value="${p.id}" ${l.produitId===p.id?'selected':''}>${esc((p.ref?p.ref+' · ':'')+p.designation)}</option>`).join('')}
    </select></td>
    <td><input value="${esc(l.designation)}" oninput="editLignes[${i}].designation=this.value"></td>
    <td><input type="number" step="0.01" min="0" value="${l.qte}" oninput="editLignes[${i}].qte=this.value; majTotaux(${i})"></td>
    <td><input type="number" step="0.01" min="0" value="${l.pu}" oninput="editLignes[${i}].pu=this.value; majTotaux(${i})"></td>
    <td><input type="number" step="0.01" min="0" max="100" value="${l.remise||0}" oninput="editLignes[${i}].remise=this.value; majTotaux(${i})"></td>
    <td><select onchange="editLignes[${i}].tva=this.value; majTotaux(${i})">
      ${[20,14,10,7,0].map(t=>`<option value="${t}" ${Number(l.tva)===t?'selected':''}>${t}%</option>`).join('')}</select></td>
    <td class="ln-total" id="lt${i}">${fmt(net)}</td>
    <td><button class="btn btn-ghost btn-sm" style="color:var(--red)" title="Retirer" onclick="editLignes.splice(${i},1); renderLignes()">×</button></td>
  </tr>`;}).join('');
  majTotaux();
}
function pickProduit(i, pid){
  editLignes[i].produitId = pid;
  const p = produitById(pid);
  if(p){
    editLignes[i].designation = p.designation;
    editLignes[i].pu = isAchat(editType) ? (Number(p.prixAchat)||Number(p.prixVente)||0) : p.prixVente;
    editLignes[i].tva = p.tva;
  }
  renderLignes();
}
function addLigne(){
  editLignes.push({produitId:'', designation:'', qte:1, pu:0, remise:0, tva:DB.societe.tvaDefaut ?? 20});
  renderLignes();
}
function majTotaux(i){
  if(i!==undefined){
    const l = editLignes[i];
    const brut = (Number(l.qte)||0)*(Number(l.pu)||0);
    const el = $('#lt'+i); if(el) el.textContent = fmt(r2(brut - brut*(Number(l.remise)||0)/100));
  }
  const c = calcDoc({lignes:editLignes});
  const tvaRows = Object.entries(c.tvaMap).filter(([,v])=>v>0)
    .map(([t,v])=>`<div class="row"><span>TVA ${t} %</span><span>${fmt(v)}</span></div>`).join('');
  $('#docTotaux').innerHTML = `
    ${c.remise>0?`<div class="row"><span>Remises accordées</span><span>− ${fmt(c.remise)}</span></div>`:''}
    <div class="row"><span>Total HT</span><span>${fmt(c.ht)}</span></div>
    ${tvaRows || '<div class="row"><span>TVA</span><span>0,00</span></div>'}
    <div class="row grand"><span>Total TTC</span><span>${fmt(c.ttc)} DH</span></div>`;
}

function saveDoc(type, id){
  const lignes = editLignes
    .map(l=>({produitId:l.produitId||'', designation:(l.designation||'').trim(), qte:Number(l.qte)||0, pu:Number(l.pu)||0, remise:Number(l.remise)||0, tva:Number(l.tva)||0}))
    .filter(l=> l.designation && l.qte>0);
  if(!lignes.length) return toast('Ajoutez au moins une ligne valide (désignation + quantité).', true);
  const numSaisi = ($('#d_num')?.value || '').trim();
  if(numSaisi && DB[type].some(x=>x.numero===numSaisi && x.id!==id))
    return toast('Ce numéro existe déjà pour un autre document de ce type.', true);
  const base = { clientId:$('#d_client').value, date:$('#d_date').value||today(), lignes, notes:$('#d_notes').value.trim() };
  if(numSaisi) base.numero = numSaisi;
  if(type==='devis' || type==='bc' || type==='commandes') base.statut = $('#d_statut').value;
  if(type==='factures' || type==='fachats') base.echeance = $('#d_ech').value;
  if(type==='factures') base.rasTaux = Math.min(100, Math.max(0, parseFloat($('#d_ras').value)||0));
  if($('#d_depot')) base.depotId = $('#d_depot').value;
  if(type==='avoirs' || type==='retours'){
    const of = factureById($('#d_origine').value);
    base.origineId = of?.id || ''; base.origine = of?.numero || '';
  }
  if(id){
    const d = DB[type].find(x=>x.id===id);
    if(type==='factures'){ appliquerStock(d.lignes, +1, d.depotId); Object.assign(d, base); appliquerStock(lignes, -1, base.depotId); }
    else if((type==='avoirs' && !d.sansStock) || type==='retours'){ appliquerStock(d.lignes, -1, d.depotId); Object.assign(d, base); appliquerStock(lignes, +1, base.depotId); }
    else if(type==='retoursF'){ appliquerStock(d.lignes, +1, d.depotId); Object.assign(d, base); appliquerStock(lignes, -1, base.depotId); }
    else Object.assign(d, base);
  } else {
    base.id = uid();
    if(!base.numero) base.numero = nextNumero(type);
    if(type==='bc' && !base.statut) base.statut = 'en cours';
    DB[type].push(base);
    if(type==='factures') appliquerStock(lignes, -1, base.depotId);
    if(type==='avoirs' || type==='retours') appliquerStock(lignes, +1, base.depotId);
    if(type==='retoursF') appliquerStock(lignes, -1, base.depotId);
  }
  saveDB(); closeModal(); render(); toast('Document enregistré ✓');
}
function delDoc(type, id){
  if(type==='factures'){
    if(DB.reglements.some(r=>r.factureId===id)) return toast('Supprimez d\u2019abord les règlements liés à cette facture.', true);
    if(DB.avoirs.some(a=>a.origineId===id)) return toast('Un avoir est lié à cette facture : supprimez-le d\u2019abord.', true);
  }
  if(type==='fachats' && DB.reglementsF.some(r=>r.factureId===id))
    return toast('Supprimez d\u2019abord les paiements liés à cette facture d\u2019achat.', true);
  const d = DB[type].find(x=>x.id===id);
  const supp = type==='bc' && (d.statut||'en cours')==='reçue'
    ? 'Cette commande a été réceptionnée : les quantités seront retirées du stock. Supprimer ?'
    : 'Supprimer ce document définitivement ?';
  if(!confirm(supp)) return;
  if(type==='factures') appliquerStock(d.lignes, +1, d.depotId);
  if((type==='avoirs' && !d.sansStock) || type==='retours') appliquerStock(d.lignes, -1, d.depotId);
  if(type==='retoursF') appliquerStock(d.lignes, +1, d.depotId);
  if(type==='bc' && (d.statut||'en cours')==='reçue') appliquerStock(d.lignes, -1, d.depotId);
  DB[type] = DB[type].filter(x=>x.id!==id);
  saveDB(); render(); toast('Document supprimé');
}

/* --- Conversions & réception --- */
function docVersFacture(srcType, id){
  const d = DB[srcType].find(x=>x.id===id);
  if(!confirm('Créer une facture à partir de '+d.numero+' ?')) return;
  const f = { id:uid(), numero:nextNumero('factures'), date:today(), clientId:d.clientId,
    lignes:JSON.parse(JSON.stringify(d.lignes)), notes:d.notes||'', echeance:'', rasTaux:0, depotId:DB.depots[0].id, origine:d.numero };

  d.statut = srcType==='commandes' ? 'facturée' : 'facturé';

function bcVersFachat(id){

function receptionnerBC(id){

  if(!confirm('Réceptionner la commande '+b.numero+' ?\nLes quantités commandées seront ajoutées au stock du dépôt « '+esc(depotById(b.depotId)?.nom||DB.depots[0].nom)+' ».')) return;

function commandeVersBL(id){
  const cde = DB.commandes.find(x=>x.id===id);
  if(!confirm('Générer un bon de livraison pour la commande '+cde.numero+' ?')) return;

/* ---------- Règlements (encaissements clients / paiements fournisseurs) ---------- */
let regTab = 'C', filtreReg = '';
const MODES_SUIVIS = m => /Chèque|Effet/.test(m||'');
const STATUTS_REG = ['en portefeuille','remis en banque','encaissé','impayé'];

function vReglements(){
  const isC = regTab==='C';
  const arrSrc = isC ? DB.reglements : DB.reglementsF;
  const docOf = r => isC ? factureById(r.factureId) : fachatById(r.factureId);
  const tiersOf = r => { const f = docOf(r); return (isC ? clientById(f?.clientId) : fournisseurById(f?.clientId))?.nom || '—'; };
  let arr = [...arrSrc].sort((a,b)=> b.date.localeCompare(a.date));
  if(filtreReg) arr = arr.filter(r=> ((docOf(r)?.numero||'')+' '+tiersOf(r)+' '+(r.reference||'')).toLowerCase().includes(filtreReg.toLowerCase()));
  const moisCour = today().slice(0,7);
  const totalMois = arrSrc.filter(r=> r.date.slice(0,7)===moisCour && r.statut!=='impayé').reduce((a,r)=>a+Number(r.montant||0),0);
  const portefeuille = arrSrc.filter(r=> MODES_SUIVIS(r.mode) && ['en portefeuille','remis en banque'].includes(r.statut||'')).reduce((a,r)=>a+Number(r.montant||0),0);
  return `
  <div class="page-head"><div><h2>Règlements</h2><div class="sub">Trésorerie : encaissements clients et paiements fournisseurs</div></div>
    <button class="btn btn-primary" onclick="editReglement('${regTab}')">+ ${isC?'Encaisser (client)':'Payer (fournisseur)'}</button></div>
  <div class="tabs">
    <button class="${isC?'active':''}" onclick="regTab='C'; render()">Encaissements clients</button>
    <button class="${!isC?'active':''}" onclick="regTab='F'; render()">Paiements fournisseurs</button>
  </div>
  <div class="chips">
    <div class="chip">${isC?'Encaissé':'Payé'} ce mois<b style="color:var(--green)">${fmtDH(totalMois)}</b></div>
    <div class="chip">Chèques &amp; effets en portefeuille / en banque<b style="color:var(--blue)">${fmtDH(portefeuille)}</b></div>
  </div>
  <div class="toolbar"><input type="search" placeholder="Rechercher (n° document, ${isC?'client':'fournisseur'}, référence)…" value="${esc(filtreReg)}" oninput="filtreReg=this.value; render()"></div>
  <div class="card">${arr.length ? `
    <table class="list"><thead><tr><th>Date</th><th>${isC?'Facture':'Facture d\u2019achat'}</th><th>${isC?'Client':'Fournisseur'}</th><th>Mode</th><th>Référence</th><th>Suivi chèque / effet</th><th class="num">Montant</th><th></th></tr></thead><tbody>
    ${arr.map(r=>{
      const f = docOf(r);
      const impaye = r.statut==='impayé';
      const suivi = MODES_SUIVIS(r.mode)
        ? `<select onchange="setStatutReg('${regTab}','${r.id}',this.value)" style="padding:4px 8px; border:1px solid var(--line); border-radius:6px; font-size:.8rem; ${impaye?'color:var(--red); font-weight:700':''}">
            ${STATUTS_REG.map(s=>`<option ${(r.statut||'en portefeuille')===s?'selected':''}>${s}</option>`).join('')}</select>`
        : '<span style="color:var(--muted)">—</span>';
      return `<tr>
      <td>${dfr(r.date)}</td><td><b>${esc(f?.numero||'—')}</b></td><td>${esc(tiersOf(r))}</td>
      <td><span class="badge b-blue">${esc(r.mode)}</span></td><td>${esc(r.reference||'—')}</td>
      <td>${suivi}</td>
      <td class="num" style="color:${impaye?'var(--red)':'var(--green)'}; font-weight:700; ${impaye?'text-decoration:line-through':''}">${fmtDH(r.montant)}</td>
      <td class="actions">${regTab==='C'?`<button class="btn btn-ghost btn-sm" title="Imprimer le reçu de paiement" onclick="imprimerRecu('${r.id}')">🧾</button>`:''}${regTab==='C' && /Effet/.test(r.mode||'')?`<button class="btn btn-ghost btn-sm" title="Imprimer la lettre de change (LCN)" onclick="imprimerTraite('${r.id}')">📜</button>`:''}<button class="btn btn-ghost btn-sm" title="Supprimer" onclick="delReglement('${regTab}','${r.id}')" style="color:var(--red)">🗑</button></td>
      </tr>`;}).join('')}
    </tbody></table>` : `<div class="empty">Aucun ${isC?'encaissement':'paiement'} enregistré.</div>`}

function setStatutReg(tab, id, val){
  const arr = tab==='C' ? DB.reglements : DB.reglementsF;
  const r = arr.find(x=>x.id===id); if(!r) return;
  r.statut = val;
  saveDB(); render();
  toast(val==='impayé' ? '⚠ Règlement marqué impayé : le document redevient dû.' : 'Suivi mis à jour ✓', val==='impayé');
}
function editReglement(tab, factureId){
  const isC = tab==='C';
  const src = isC ? DB.factures : DB.fachats;
  const reste = isC ? resteFacture : resteFachat;
  const nomDe = f => (isC ? clientById(f.clientId) : fournisseurById(f.clientId))?.nom || '';
  const nonSoldees = src.filter(f=> reste(f) > 0.004);
  if(!nonSoldees.length && !factureId) return toast(isC?'Toutes les factures clients sont soldées 🎉':'Toutes les factures d\u2019achat sont payées 🎉', true);
  const fid = factureId || nonSoldees[0]?.id;
  const liste = factureId ? src.filter(f=>f.id===factureId).concat(nonSoldees.filter(f=>f.id!==factureId)) : nonSoldees;
  const opts = liste.map(f=>{
    const r = reste(f);
    return `<option value="${f.id}" data-reste="${r}" ${f.id===fid?'selected':''}>${esc(f.numero)} — ${esc(nomDe(f))} (reste ${fmt(r)} DH)</option>`;
  }).join('');
  const doc0 = src.find(f=>f.id===fid);
  const reste0 = doc0 ? reste(doc0) : 0;

function saveReglement(tab){
  const m = parseFloat($('#r_mnt').value);
  if(isNaN(m) || m <= 0) return toast('Montant invalide.', true);
  const mode = $('#r_mode').value;
  const o = { id:uid(), factureId:$('#r_fac').value, date:$('#r_date').value||today(),
    montant:r2(m), mode, reference:$('#r_ref').value.trim(),
    compteId:$('#r_cpt').value, echeance:$('#r_ech').value };
  if(MODES_SUIVIS(mode)) o.statut = 'en portefeuille';
  if(tab==='C') o.recu = nextNumero('recus');
  (tab==='C' ? DB.reglements : DB.reglementsF).push(o);
  saveDB(); closeModal(); render(); toast(tab==='C'?'Règlement encaissé ✓':'Paiement enregistré ✓');
}
function delReglement(tab, id){
  if(!confirm('Supprimer ce règlement ?')) return;
  if(tab==='C') DB.reglements = DB.reglements.filter(r=>r.id!==id);
  else DB.reglementsF = DB.reglementsF.filter(r=>r.id!==id);
  saveDB(); render(); toast('Règlement supprimé');
}

/* ---------- Échéancier & relances ---------- */
function bucketRetard(retard){
  if(retard <= 0) return {lbl:'À échoir', cls:'b-blue', k:'a'};
  if(retard <= 30) return {lbl:'1–30 j', cls:'b-amber', k:'b'};
  if(retard <= 60) return {lbl:'31–60 j', cls:'b-amber', k:'c'};
  if(retard <= 90) return {lbl:'61–90 j', cls:'b-red', k:'d'};
  return {lbl:'+90 j', cls:'b-red', k:'e'};
}
function vEcheancier(){
  const now = new Date(today());
  const bloc = (src, reste, nomDe, isC) => {
    const rows = src.filter(f=> reste(f) > 0.004)
      .map(f=>{
        const ech = f.echeance || f.date;
        const retard = Math.floor((now - new Date(ech)) / 864e5);
        return {f, ech, retard, r:reste(f), b:bucketRetard(retard)};
      }).sort((a,b)=> b.retard - a.retard);
    const tot = {a:0,b:0,c:0,d:0,e:0};
    rows.forEach(x=> tot[x.b.k] += x.r);
    const chips = `
    <div class="chips">
      <div class="chip">À échoir<b>${fmtDH(tot.a)}</b></div>
      <div class="chip">1–30 j<b style="color:#9A6410">${fmtDH(tot.b)}</b></div>
      <div class="chip">31–60 j<b style="color:#9A6410">${fmtDH(tot.c)}</b></div>
      <div class="chip">61–90 j<b style="color:var(--red)">${fmtDH(tot.d)}</b></div>
      <div class="chip">+90 j<b style="color:var(--red)">${fmtDH(tot.e)}</b></div>
      <div class="chip">Total<b>${fmtDH(rows.reduce((a,x)=>a+x.r,0))}</b></div>
    </div>`;
    const table = rows.length ? `
    <table class="list"><thead><tr><th>N°</th><th>${isC?'Client':'Fournisseur'}</th><th>Date</th><th>Échéance</th>
      <th class="num">TTC</th><th class="num">Reste</th><th>Retard</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr>
      <td><b>${esc(x.f.numero)}</b></td><td>${esc(nomDe(x.f))}</td>
      <td>${dfr(x.f.date)}</td><td>${x.f.echeance?dfr(x.f.echeance):'<span style="color:var(--muted)">non fixée</span>'}</td>
      <td class="num">${fmtDH(calcDoc(x.f).ttc)}</td>
      <td class="num" style="font-weight:700; color:var(--red)">${fmtDH(x.r)}</td>
      <td><span class="badge ${x.b.cls}">${x.b.lbl}${x.retard>0?' ('+x.retard+' j)':''}</span></td>
      <td class="actions">
        ${isC?`<button class="btn btn-ghost btn-sm" title="Lettre de relance graduée" onclick="openRelance('${x.f.clientId}')">📨</button>
        <button class="btn btn-ghost btn-sm" title="Relevé de compte" onclick="imprimerReleve('${x.f.clientId}')">📄</button>
        <button class="btn btn-ghost btn-sm" title="Encaisser" onclick="editReglement('C','${x.f.id}')" style="color:var(--green)">💰</button>`
        :`<button class="btn btn-ghost btn-sm" title="Payer" onclick="editReglement('F','${x.f.id}')" style="color:var(--green)">💰</button>`}
        <button class="btn btn-ghost btn-sm" title="Imprimer" onclick="imprimer('${isC?'factures':'fachats'}','${x.f.id}')">🖨</button>
      </td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">Rien en attente 🎉</div>';
    return chips + '<div class="card">' + table + '</div>';
  };
  return `
  <div class="page-head"><div><h2>Échéancier &amp; relances</h2><div class="sub">Balance âgée des créances clients et dettes fournisseurs</div></div></div>
  <h3 style="margin:4px 0 10px">À encaisser — clients</h3>
  ${bloc(DB.factures, resteFacture, f=>clientById(f.clientId)?.nom||'—', true)}
  <h3 style="margin:22px 0 10px">À payer — fournisseurs</h3>
  ${bloc(DB.fachats, resteFachat, f=>fournisseurById(f.clientId)?.nom||'—', false)}`;
}

/* ---------- Rapports & journaux ---------- */
let rapTab='jventes', rapAn=new Date().getFullYear(), rapMois='';
function anneesDispo(){
  const s = new Set([new Date().getFullYear()]);
  ['factures','avoirs','fachats'].forEach(t=> DB[t].forEach(d=> s.add(new Date(d.date).getFullYear())));
  return [...s].sort((a,b)=>b-a);
}
function inPeriode(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear()===Number(rapAn) && (rapMois==='' || d.getMonth()===Number(rapMois));
}
function journalRows(kind){
  const src = kind==='ventes'
    ? [{arr:DB.factures, s:1, t:'C'}, {arr:DB.avoirs, s:-1, t:'C'}]
    : [{arr:DB.fachats, s:1, t:'F'}];
  const rows = [];
  src.forEach(({arr,s,t})=> arr.forEach(d=>{
    if(!inPeriode(d.date)) return;
    const c = calcDoc(d);
    const tiers = (t==='C' ? clientById(d.clientId) : fournisseurById(d.clientId)) || {};
    const tv = {}; [20,14,10,7].forEach(x=> tv[x] = r2(s*(c.tvaMap[x]||0)));
    rows.push({date:d.date, num:d.numero, tiers:tiers.nom||'—', ice:tiers.ice||'', ht:r2(s*c.ht), tv, tva:r2(s*c.tva), ttc:r2(s*c.ttc)});
  }));
  return rows.sort((a,b)=> a.date.localeCompare(b.date));
}
function vRapports(){
  const anOpts = anneesDispo().map(a=>`<option ${Number(rapAn)===a?'selected':''}>${a}</option>`).join('');
  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  const moisOpts = `<option value="">Année entière</option>` + moisNoms.map((m,i)=>`<option value="${i}" ${rapMois!==''&&Number(rapMois)===i?'selected':''}>${m}</option>`).join('');
  const periode = `
    <select onchange="rapAn=this.value; render()">${anOpts}</select>
    <select onchange="rapMois=this.value; render()">${moisOpts}</select>`;
  let corps = '';

  if(rapTab==='jventes' || rapTab==='jachats'){
    const kind = rapTab==='jventes' ? 'ventes' : 'achats';
    const rows = journalRows(kind);
    const tot = rows.reduce((a,r)=>{ a.ht+=r.ht; a.tva+=r.tva; a.ttc+=r.ttc; [20,14,10,7].forEach(x=>a.tv[x]+=r.tv[x]); return a; },
      {ht:0,tva:0,ttc:0,tv:{20:0,14:0,10:0,7:0}});
    corps = `
    <div class="toolbar">${periode}
      <button class="btn btn-accent" onclick="exportJournal('${kind}')">⬇ Exporter CSV (Excel)</button></div>
    <div class="card">${rows.length ? `
      <table class="list"><thead><tr><th>Date</th><th>N°</th><th>${kind==='ventes'?'Client':'Fournisseur'}</th><th>ICE</th>
        <th class="num">HT</th><th class="num">TVA 20%</th><th class="num">TVA 14%</th><th class="num">TVA 10%</th><th class="num">TVA 7%</th><th class="num">TVA</th><th class="num">TTC</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${dfr(r.date)}</td><td><b>${esc(r.num)}</b></td><td>${esc(r.tiers)}</td><td>${esc(r.ice)}</td>
        <td class="num">${fmt(r.ht)}</td><td class="num">${fmt(r.tv[20])}</td><td class="num">${fmt(r.tv[14])}</td>
        <td class="num">${fmt(r.tv[10])}</td><td class="num">${fmt(r.tv[7])}</td><td class="num">${fmt(r.tva)}</td>
        <td class="num"><b>${fmt(r.ttc)}</b></td></tr>`).join('')}
      <tr style="background:#F4F7F6; font-weight:800"><td colspan="4">TOTAUX</td>
        <td class="num">${fmt(tot.ht)}</td><td class="num">${fmt(tot.tv[20])}</td><td class="num">${fmt(tot.tv[14])}</td>
        <td class="num">${fmt(tot.tv[10])}</td><td class="num">${fmt(tot.tv[7])}</td><td class="num">${fmt(tot.tva)}</td>
        <td class="num">${fmt(tot.ttc)}</td></tr>
      </tbody></table>` : '<div class="empty">Aucune écriture sur la période. Les avoirs apparaissent en négatif dans le journal des ventes.</div>'}
    </div>`;
  }

  if(rapTab==='marges'){
    const agg = {};
    [{arr:DB.factures, s:1},{arr:DB.avoirs, s:-1}].forEach(({arr,s})=> arr.forEach(d=>{
      if(!inPeriode(d.date)) return;
      d.lignes.forEach(l=>{
        const key = l.produitId || '_libre';
        if(!agg[key]) agg[key] = {qte:0, ca:0};
        const brut = (Number(l.qte)||0)*(Number(l.pu)||0);
        agg[key].qte += s*(Number(l.qte)||0);
        agg[key].ca  += s*r2(brut - brut*(Number(l.remise)||0)/100);
      });

    const lignes = Object.entries(agg).map(([pid,v])=>{
      const p = produitById(pid);
      const cout = p ? r2(v.qte*(Number(p.prixAchat)||0)) : 0;
      const marge = r2(v.ca - cout);
      return {nom: p ? (p.ref?p.ref+' · ':'')+p.designation : '(lignes libres)', qte:v.qte, ca:r2(v.ca), cout, marge,
        taux: v.ca ? r2(marge/v.ca*100) : 0};
    }).sort((a,b)=> b.ca - a.ca);
    const clientsAgg = {};
    [{arr:DB.factures, s:1},{arr:DB.avoirs, s:-1}].forEach(({arr,s})=> arr.forEach(d=>{
      if(!inPeriode(d.date)) return;
      clientsAgg[d.clientId] = r2((clientsAgg[d.clientId]||0) + s*calcDoc(d).ttc);
    }));
    const topClients = Object.entries(clientsAgg).map(([id,ca])=>({nom:clientById(id)?.nom||'—', ca})).sort((a,b)=>b.ca-a.ca).slice(0,10);
    corps = `
    <div class="toolbar">${periode}</div>
    <div class="dash-grid">
      <div class="card card-pad"><h3>Marge par produit (ventes nettes d'avoirs)</h3>
        ${lignes.length?`<table class="list"><thead><tr><th>Produit</th><th class="num">Qté</th><th class="num">CA HT</th><th class="num">Coût (PA)</th><th class="num">Marge</th><th class="num">%</th></tr></thead><tbody>
        ${lignes.map(l=>`<tr><td>${esc(l.nom)}</td><td class="num">${fmt(l.qte)}</td><td class="num">${fmt(l.ca)}</td>
          <td class="num">${fmt(l.cout)}</td><td class="num" style="font-weight:700; color:${l.marge>=0?'var(--green)':'var(--red)'}">${fmt(l.marge)}</td>
          <td class="num">${fmt(l.taux)} %</td></tr>`).join('')}
        </tbody></table>`:'<div class="empty">Aucune vente sur la période.</div>'}
      </div>
      <div class="card card-pad"><h3>Top clients (CA TTC net)</h3>
        ${topClients.length?`<table class="list"><tbody>
        ${topClients.map((c,i)=>`<tr><td>${i+1}. <b>${esc(c.nom)}</b></td><td class="num">${fmtDH(c.ca)}</td></tr>`).join('')}
        </tbody></table>`:'<div class="empty">Aucune vente sur la période.</div>'}
      </div>
    </div>`;
  }

  if(rapTab==='ca'){
    const anN = Number(rapAn), anP = anN-1;
    const serie = an => {
      const m = Array(12).fill(0);
      DB.factures.forEach(f=>{ const d=new Date(f.date); if(d.getFullYear()===an) m[d.getMonth()] += calcDoc(f).ttc; });
      DB.avoirs.forEach(a=>{ const d=new Date(a.date); if(d.getFullYear()===an) m[d.getMonth()] -= calcDoc(a).ttc; });
      return m.map(r2);
    };
    const sN = serie(anN), sP = serie(anP);
    const moisN = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    corps = `
    <div class="toolbar"><select onchange="rapAn=this.value; render()">${anOpts}</select></div>
    <div class="card">
      <table class="list"><thead><tr><th>Mois</th><th class="num">${anP}</th><th class="num">${anN}</th><th class="num">Évolution</th></tr></thead><tbody>
      ${moisN.map((m,i)=>{
        const ev = sP[i] ? r2((sN[i]-sP[i])/sP[i]*100) : (sN[i]?100:0);
        return `<tr><td>${m}</td><td class="num">${fmt(sP[i])}</td><td class="num"><b>${fmt(sN[i])}</b></td>
        <td class="num" style="font-weight:700; color:${ev>=0?'var(--green)':'var(--red)'}">${ev>=0?'+':''}${fmt(ev)} %</td></tr>`;}).join('')}
      <tr style="background:#F4F7F6; font-weight:800"><td>TOTAL</td><td class="num">${fmt(sP.reduce((a,b)=>a+b,0))}</td>
        <td class="num">${fmt(sN.reduce((a,b)=>a+b,0))}</td><td></td></tr>
      </tbody></table>
    </div>`;
  }

  if(rapTab==='resultat'){
    const anN = Number(rapAn);
    const vHT = Array(12).fill(0), aHT = Array(12).fill(0), chg = Array(12).fill(0);
    DB.factures.forEach(f=>{ const d=new Date(f.date); if(d.getFullYear()===anN) vHT[d.getMonth()] += calcDoc(f).ht; });
    DB.avoirs.forEach(a=>{ const d=new Date(a.date); if(d.getFullYear()===anN) vHT[d.getMonth()] -= calcDoc(a).ht; });
    DB.fachats.forEach(f=>{ const d=new Date(f.date); if(d.getFullYear()===anN) aHT[d.getMonth()] += calcDoc(f).ht; });
    DB.charges.forEach(c=>{ const d=new Date(c.date); if(d.getFullYear()===anN) chg[d.getMonth()] += Number(c.montant)||0; });
    const moisNoms2 = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    let cum = 0;
    corps = `
    <div class="toolbar"><select onchange="rapAn=this.value; render()">${anOpts}</select></div>
    <div class="card">
      <table class="list"><thead><tr><th>Mois</th><th class="num">Ventes HT (nettes)</th><th class="num">Achats HT</th>
        <th class="num">Charges</th><th class="num">Résultat</th><th class="num">Cumul</th></tr></thead><tbody>
      ${moisNoms2.map((m,i)=>{
        const res = r2(vHT[i]-aHT[i]-chg[i]); cum = r2(cum+res);
        return `<tr><td>${m}</td><td class="num">${fmt(vHT[i])}</td><td class="num">${fmt(aHT[i])}</td>
        <td class="num">${fmt(chg[i])}</td>
        <td class="num" style="font-weight:700; color:${res>=0?'var(--green)':'var(--red)'}">${fmt(res)}</td>
        <td class="num" style="color:${cum>=0?'var(--green)':'var(--red)'}">${fmt(cum)}</td></tr>`;}).join('')}
      <tr style="background:#F4F7F6; font-weight:800"><td>TOTAL ${anN}</td>
        <td class="num">${fmt(vHT.reduce((a,b)=>a+b,0))}</td><td class="num">${fmt(aHT.reduce((a,b)=>a+b,0))}</td>
        <td class="num">${fmt(chg.reduce((a,b)=>a+b,0))}</td>
        <td class="num" colspan="2" style="color:${cum>=0?'var(--green)':'var(--red)'}">${fmt(cum)}</td></tr>
      </tbody></table>
      <p style="padding:12px; font-size:.8rem; color:var(--muted)">Estimation de gestion (ventes HT nettes d'avoirs − achats HT − charges). Ne remplace pas la comptabilité officielle (amortissements, variations de stock…).</p>
    </div>`;
  }

  if(rapTab==='tva'){
    const jv = journalRows('ventes'), ja = journalRows('achats');
    const coll = {20:0,14:0,10:0,7:0}, ded = {20:0,14:0,10:0,7:0};
    jv.forEach(r=> [20,14,10,7].forEach(x=> coll[x] = r2(coll[x]+r.tv[x])));
    ja.forEach(r=> [20,14,10,7].forEach(x=> ded[x] = r2(ded[x]+r.tv[x])));
    const tColl = r2(Object.values(coll).reduce((a,b)=>a+b,0));
    const tDed = r2(Object.values(ded).reduce((a,b)=>a+b,0));

    corps = `
    <div class="toolbar">${periode}</div>

      <table class="list"><thead><tr><th>Taux</th><th class="num">TVA collectée (ventes)</th><th class="num">TVA déductible (achats)</th><th class="num">Différence</th></tr></thead><tbody>
      ${[20,14,10,7].map(x=>`<tr><td><b>${x} %</b></td><td class="num">${fmt(coll[x])}</td><td class="num">${fmt(ded[x])}</td>
        <td class="num">${fmt(r2(coll[x]-ded[x]))}</td></tr>`).join('')}
      <tr style="background:#F4F7F6; font-weight:800"><td>TOTAL</td><td class="num">${fmt(tColl)}</td><td class="num">${fmt(tDed)}</td>
        <td class="num" style="color:${due>=0?'var(--red)':'var(--green)'}">${fmt(due)}</td></tr>
      </tbody></table>
      <div style="padding:14px 16px">
        <div class="chip" style="display:inline-block">${due>=0?'TVA due au Trésor sur la période':'Crédit de TVA sur la période'}
          <b style="color:${due>=0?'var(--red)':'var(--green)'}; font-size:1.2rem">${fmt(Math.abs(due))} DH</b></div>
        <p style="font-size:.8rem; color:var(--muted); margin-top:10px">Préparation basée sur les factures émises et reçues (régime des débits). Ne prend pas en compte le crédit reporté, le prorata ni la TVA sur charges non saisies en factures d'achat. À valider avec votre comptable avant télédéclaration (SIMPL-TVA).</p>
      </div>
    </div>`;
  }

  return `
  <div class="page-head"><div><h2>Rapports</h2><div class="sub">Journaux comptables, marges, résultat et TVA — CA net des avoirs</div></div></div>
  <div class="tabs">
    <button class="${rapTab==='jventes'?'active':''}" onclick="rapTab='jventes'; render()">Journal des ventes</button>
    <button class="${rapTab==='jachats'?'active':''}" onclick="rapTab='jachats'; render()">Journal des achats</button>
    <button class="${rapTab==='marges'?'active':''}" onclick="rapTab='marges'; render()">Marges &amp; tops</button>
    <button class="${rapTab==='ca'?'active':''}" onclick="rapTab='ca'; render()">CA comparé N / N-1</button>
    <button class="${rapTab==='resultat'?'active':''}" onclick="rapTab='resultat'; render()">Résultat mensuel</button>
    <button class="${rapTab==='tva'?'active':''}" onclick="rapTab='tva'; render()">Déclaration TVA</button>
  </div>
  ${corps}`;
}
function exportJournal(kind){
  const rows = journalRows(kind);
  if(!rows.length) return toast('Aucune écriture à exporter sur la période.', true);
  const num = v => (Number(v)||0).toFixed(2).replace('.', ',');
  const q = s => '"' + String(s??'').replace(/"/g,'""') + '"';
  const head = ['Date','Numéro', kind==='ventes'?'Client':'Fournisseur','ICE','Total HT','TVA 20%','TVA 14%','TVA 10%','TVA 7%','Total TVA','Total TTC'];
  const lines = [head.join(';')];
  const tot = {ht:0,tva:0,ttc:0,tv:{20:0,14:0,10:0,7:0}};
  rows.forEach(r=>{
    lines.push([dfr(r.date), q(r.num), q(r.tiers), q(r.ice), num(r.ht), num(r.tv[20]), num(r.tv[14]), num(r.tv[10]), num(r.tv[7]), num(r.tva), num(r.ttc)].join(';'));
    tot.ht+=r.ht; tot.tva+=r.tva; tot.ttc+=r.ttc; [20,14,10,7].forEach(x=>tot.tv[x]+=r.tv[x]);
  });
  lines.push(['','','TOTAUX','', num(tot.ht), num(tot.tv[20]), num(tot.tv[14]), num(tot.tv[10]), num(tot.tv[7]), num(tot.tva), num(tot.ttc)].join(';'));
  const per = rapMois==='' ? rapAn : rapAn+'-'+String(Number(rapMois)+1).padStart(2,'0');
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'journal-'+kind+'-'+per+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Journal exporté ✓ (ouvrez-le dans Excel)');
}

/* Safari/iOS applique de façon peu fiable les largeurs posées sur les <th>
   d'un tableau en table-layout:fixed (la colonne « Désignation » se
   retrouve tantôt écrasée, tantôt normale selon la page) — un <colgroup>
   explicite est la seule méthode que WebKit respecte systématiquement. */
function colgroupFromThead(theadHtml){
  const ths = (theadHtml||'').match(/<th\b[^>]*>/g) || [];
  const cols = ths.map(th => {
    const m = th.match(/width:\s*([\d.]+(?:px|%))/);
    return m ? `<col style="width:${m[1]}">` : '<col>';
  });
  return `<colgroup>${cols.join('')}</colgroup>`;
}

}

function piedPrint(){
