/* Estime le nombre de lignes qu'un texte occupera une fois retourné à la
   ligne dans une colonne d'environ charsParLigne caractères de large —
   utilisé pour qu'une désignation très longue (plusieurs dizaines de mots)
   pèse plus dans la pagination qu'une désignation d'une seule ligne, au
   lieu d'être comptée comme « 1 ligne » et de faire déborder la page. */
function estimerLignesTexte(txt, charsParLigne){
  const t = String(txt||'');
  if(!t) return 1;
  return t.split('\n').reduce((n,seg)=> n + Math.max(1, Math.ceil(seg.length / charsParLigne)), 0);
}
/* Pagination : découpe les lignes en pages A4, répète l'en-tête et le pied,
   numérote « Page i / N », réserve la place des totaux/signature en dernière page.
   Chaque ligne peut être une chaîne HTML (poids 1) ou {html, weight} pour les
   désignations longues qui prennent plusieurs « unités-ligne ». */
function pagesDoc(o){
  // Capacités réelles d'une page A4 en « unités-ligne » (~30 px chacune)
  const cap1 = Math.max(6, (o.cap1 ?? 22) - (o.avantCost ?? 0) + (o.metaHtml ? 0 : 3));
  const capN = o.capN ?? 27;
  const finCost = o.finHtml ? (o.finCost ?? 13) : 0;
  const rows = (o.rows || []).map(r => typeof r === 'string' ? {html:r, weight:1} : r);
  const chunks = [];
  let i = 0;
  while(true){
    const cap = chunks.length===0 ? cap1 : capN;
    const poidsRestant = rows.slice(i).reduce((s,r)=>s+r.weight, 0);
    // Tout ce qui reste + le bloc totaux/signature tient sur cette page → on termine ici
    if(poidsRestant + finCost <= cap){ chunks.push(rows.slice(i)); break; }
    // Remplit cette page jusqu'à la capacité ; une ligne à elle seule plus
    // grande que la capacité part quand même seule sur sa propre page plutôt
    // que d'être coupée au milieu avec la suivante.
    let poids = 0, j = i;
    while(j < rows.length && (poids===0 || poids + rows[j].weight <= cap)){ poids += rows[j].weight; j++; }
    if(j===i) j = i+1;
    chunks.push(rows.slice(i, j)); i = j;
    // Toutes les lignes sont placées mais le bloc final ne tenait pas → page finale dédiée
    if(i >= rows.length){ chunks.push([]); break; }
  }
  const N = chunks.length;
  return chunks.map((ch, idx)=>`
  <div class="page">
    <div class="doc-head">
      ${entetePrint()}
      <div class="doc-title"><h2>${o.titre}</h2>${o.sousTitre||''}<p class="pagenum">Page ${idx+1} / ${N}</p></div>
    </div>
    ${idx===0 && o.metaHtml ? `<div class="doc-meta">${o.metaHtml}</div>` : ''}
    ${idx===0 && o.avantHtml ? o.avantHtml : ''}
    ${ch.length ? `<table class="doc-lines">${colgroupFromThead(o.theadHtml)}<thead>${o.theadHtml||''}</thead><tbody>${ch.map(r=>r.html).join('')}</tbody></table>` : ''}
    ${idx===N-1 ? (o.finHtml||'') : ''}
    ${piedPrint()}
  </div>`).join('');
}
function imprimer(type, id){
  const d = DB[type].find(x=>x.id===id);
  const c = calcDoc(d);
  const achat = isAchat(type);
  const cl = (achat ? fournisseurById(d.clientId) : clientById(d.clientId)) || {};
  const titre = {devis:'Devis', proformas:'Facture proforma', factures:'Facture', avoirs:'Facture d\u2019avoir',
    bl:'Bon de livraison', bc:'Bon de commande', fachats:'Facture d\u2019achat',
    commandes:'Bon de commande client', retours:'Bon de retour', retoursF:'Bon de retour fournisseur'}[type];
  const isBL = type==='bl';
  const refLbl = type==='avoirs' ? 'Avoir sur facture' : 'Réf.';
  const blocTiers = achat ? 'Fournisseur' : (isBL ? 'Livré à' : 'Client');
  const tvaRows = Object.entries(c.tvaMap).filter(([,v])=>v>0)
    .map(([t,v])=>`<div class="row"><span>TVA ${t} %</span><span>${fmt(v)} DH</span></div>`).join('');
  const paye = type==='factures' ? totalRegle(d.id) : type==='fachats' ? totalRegleF(d.id) : 0;
  const avoirs = type==='factures' ? totalAvoirs(d.id) : 0;
  const ras = type==='factures' ? rasMontant(d) : 0;
  const reste = type==='factures' ? resteFacture(d) : type==='fachats' ? resteFachat(d) : 0;
  const rows = d.lignes.map((l,i2)=>{
    const brut = (Number(l.qte)||0)*(Number(l.pu)||0);
    const net = r2(brut - brut*(Number(l.remise)||0)/100);
    const p = produitById(l.produitId);
    const desTxt = (p?.ref? p.ref+' — ':'') + l.designation;
    const html = `<tr>
      <td>${i2+1}</td>
      <td>${esc(desTxt)}</td>
      <td class="num">${fmt(l.qte)}${p?.unite? ' '+esc(p.unite):''}</td>
      ${isBL?'':`<td class="num">${fmt(l.pu)}</td>
      <td class="num">${l.remise?fmt(l.remise)+' %':'—'}</td>
      <td class="num">${l.tva} %</td>
      <td class="num">${fmt(net)}</td>`}
    </tr>`;
    return {html, weight: estimerLignesTexte(desTxt, isBL?52:38)};
  });
  const theadHtml = `<tr><th style="width:30px">#</th><th>Désignation</th><th class="num" style="width:90px">Quantité</th>
    ${isBL?'':`<th class="num" style="width:90px">PU HT</th><th class="num" style="width:70px">Remise</th>
    <th class="num" style="width:60px">TVA</th><th class="num" style="width:100px">Total HT</th>`}</tr>`;
  const phraseLettres = {
    factures:'la présente facture', avoirs:'le présent avoir', devis:'le présent devis',
    proformas:'la présente facture proforma', bc:'le présent bon de commande', fachats:'la présente facture d\u2019achat',
    commandes:'le présent bon de commande', retours:'le présent bon de retour', retoursF:'le présent bon de retour'
  }[type];
  const signGauche = isBL ? 'Signature du livreur' : 'Cachet et signature';
  const signDroite = isBL ? 'Reçu par le client (nom, date, signature)'
    : achat ? 'Accord du fournisseur' : 'Bon pour accord — le client';
  const sousTitre = `
    <p><b>N° ${esc(d.numero)}</b></p>
    <p>Date : ${dfr(d.date)}</p>
    ${(type==='factures'||type==='fachats') && d.echeance ? `<p>Échéance : ${dfr(d.echeance)}</p>`:''}
    ${type==='bc' && d.dateReception ? `<p>Reçue le : ${dfr(d.dateReception)}</p>`:''}
    ${d.origine ? `<p>${refLbl} : ${esc(d.origine)}</p>`:''}`;
  const metaHtml = `<div class="blk">
    <div class="t">${blocTiers}</div>
    <p><b>${esc(cl.nom||'—')}</b></p>
    ${cl.adresse?`<p>${esc(cl.adresse)}${cl.ville?', '+esc(cl.ville):''}</p>`:''}
    ${cl.ice?`<p>ICE : ${esc(cl.ice)}</p>`:''}
    ${cl.idf?`<p>IF : ${esc(cl.idf)}</p>`:''}
    ${cl.tel?`<p>Tél : ${esc(cl.tel)}</p>`:''}
  </div>`;
  const finHtml = `
    ${isBL ? '' : `
    <div class="doc-tot">
      ${c.remise>0?`<div class="row"><span>Remises</span><span>− ${fmt(c.remise)} DH</span></div>`:''}
      <div class="row"><span>Total HT</span><span>${fmt(c.ht)} DH</span></div>
      ${tvaRows || '<div class="row"><span>TVA</span><span>0,00 DH</span></div>'}
      <div class="row grand"><span>TOTAL TTC${type==='avoirs'?' (EN VOTRE FAVEUR)':''}</span><span>${fmt(c.ttc)} DH</span></div>
      ${(type==='factures' && (paye>0 || avoirs>0 || ras>0)) || (type==='fachats' && paye>0) ? `
      ${ras>0?`<div class="row"><span>Retenue à la source (${fmt(d.rasTaux)} %)</span><span>− ${fmt(ras)} DH</span></div>`:''}
      ${avoirs>0?`<div class="row"><span>Avoir(s) déduit(s)</span><span>− ${fmt(avoirs)} DH</span></div>`:''}
      ${paye>0?`<div class="row"><span>Montant réglé</span><span>− ${fmt(paye)} DH</span></div>`:''}
      <div class="row"><span><b>Reste à payer</b></span><span><b>${fmt(reste)} DH</b></span></div>`:''}
    </div>
    <div class="doc-lettres">Arrêté ${phraseLettres} à la somme de :
      <b>${montantEnLettres(c.ttc)} TTC</b>.</div>`}
    ${d.notes?`<div class="doc-notes"><b>Notes :</b> ${esc(d.notes)}</div>`:''}
    <div class="doc-sign">
      <div><b>${signGauche}</b>${signGauche==='Cachet et signature'?cachetImgHtml():''}<div class="l">${esc(DB.societe.nom)}</div></div>
      <div><b>${signDroite}</b><div class="l">&nbsp;</div></div>
    </div>`;
  $('#printArea').innerHTML = `<div class="doc paged" ${docStyleAttr()}>` +
    pagesDoc({titre, sousTitre, metaHtml, theadHtml, rows, finHtml, cap1:22, capN:27, finCost:isBL?6:14}) + `</div>`;
  window.print();
}
function imprimerReleve(clientId){
  const cl = clientById(clientId); if(!cl) return;
  const ev = [];
  DB.factures.filter(f=>f.clientId===clientId).forEach(f=>{
    ev.push({date:f.date, lbl:'Facture '+f.numero, deb:calcDoc(f).ttc, cre:0});
    const ras = rasMontant(f);
    if(ras>0) ev.push({date:f.date, lbl:'Retenue à la source ('+fmt(f.rasTaux)+' %) — '+f.numero, deb:0, cre:ras});
  });
  DB.avoirs.filter(a=>a.clientId===clientId).forEach(a=>{
    ev.push({date:a.date, lbl:'Avoir '+a.numero+(a.origine?' (sur '+a.origine+')':''), deb:0, cre:calcDoc(a).ttc});
  });
  DB.reglements.filter(r=> r.statut!=='impayé' && factureById(r.factureId)?.clientId===clientId).forEach(r=>{
    ev.push({date:r.date, lbl:'Règlement '+r.mode+(r.reference?' n° '+r.reference:'')+' — '+(factureById(r.factureId)?.numero||''), deb:0, cre:Number(r.montant)||0});
  });
  ev.sort((a,b)=> a.date.localeCompare(b.date));
  let solde = 0;
  const rows = ev.map(e=>{
    solde = r2(solde + e.deb - e.cre);
    return `<tr><td>${dfr(e.date)}</td><td>${esc(e.lbl)}</td>
      <td class="num">${e.deb?fmt(e.deb):''}</td><td class="num">${e.cre?fmt(e.cre):''}</td>
      <td class="num"><b>${fmt(solde)}</b></td></tr>`;
  });
  const metaHtml = `
    <div class="blk"><div class="t">Client</div><p><b>${esc(cl.nom)}</b></p>
      ${cl.adresse?`<p>${esc(cl.adresse)}${cl.ville?', '+esc(cl.ville):''}</p>`:''}${cl.ice?`<p>ICE : ${esc(cl.ice)}</p>`:''}</div>
    <div class="blk" style="text-align:right"><div class="t">Solde dû</div>
      <p style="font-size:18px; font-weight:800; color:${solde>0.004?'#B7362C':'#1E7A4E'}">${fmt(solde)} DH</p></div>`;
  const finHtml = `
    ${ev.length?'':'<p style="margin-top:20px">Aucun mouvement enregistré pour ce client.</p>'}
    <div class="doc-lettres">Solde arrêté à la somme de : <b>${montantEnLettres(Math.abs(solde))}${solde<-0.004?' (en faveur du client)':''}</b>.</div>
    <div class="doc-sign">
      <div><b>Cachet et signature</b>${cachetImgHtml()}<div class="l">${esc(DB.societe.nom)}</div></div>
      <div></div>
    </div>`;
  $('#printArea').innerHTML = `<div class="doc paged" ${docStyleAttr()}>` + pagesDoc({
    titre:'Relevé de compte', sousTitre:`<p>Édité le ${dfr(today())}</p>`, metaHtml,
    theadHtml:`<tr><th style="width:80px">Date</th><th>Libellé</th><th class="num" style="width:100px">Débit</th>
      <th class="num" style="width:100px">Crédit</th><th class="num" style="width:110px">Solde</th></tr>`,
    rows, finHtml, cap1:22, capN:28, finCost:8
  }) + `</div>`;
  window.print();
}

function uploadLogo(input){
  const file = input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 120/img.height, 400/img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      DB.societe.logo = cv.toDataURL('image/png');
      saveDB(); render(); toast('Logo enregistré ✓');
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function removeLogo(){
  DB.societe.logo = '';
  saveDB(); render(); toast('Logo retiré');
}
function uploadCachet(input){
  const file = input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 260/img.height, 260/img.width);
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      DB.societe.cachet = cv.toDataURL('image/png');
      saveDB(); render(); toast('Cachet enregistré ✓');
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
function removeCachet(){
  DB.societe.cachet = '';
  saveDB(); render(); toast('Cachet retiré');
}
function addDepot(){
  const nom = $('#newDep').value.trim();
  if(!nom) return toast('Saisissez le nom du dépôt.', true);
  DB.depots.push({id:uid(), nom});
  saveDB(); render(); toast('Dépôt ajouté ✓');
}
function renameDepot(id, val){
  const dp = depotById(id); if(!dp) return;
  if(!val.trim()) return toast('Le nom ne peut pas être vide.', true);
  dp.nom = val.trim(); saveDB(); toast('Dépôt renommé ✓');
}
function delDepot(id){
  if(DB.depots.length<=1) return toast('Il faut au moins un dépôt.', true);
  if(DB.produits.some(p=> Math.abs(Number(p.stocks?.[id])||0) > 0.004))
    return toast('Ce dépôt contient encore du stock : transférez-le d\u2019abord (± Stock).', true);
  if(['factures','avoirs','bc'].some(t=> DB[t].some(d=>d.depotId===id)))
    return toast('Des documents référencent ce dépôt : il ne peut pas être supprimé.', true);
  if(!confirm('Supprimer ce dépôt ?')) return;
  DB.depots = DB.depots.filter(d=>d.id!==id);
  DB.produits.forEach(p=>{ if(p.stocks) delete p.stocks[id]; });
  saveDB(); render(); toast('Dépôt supprimé');
}
function exporter(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sauvegarde-tijara-' + today() + '.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Sauvegarde exportée ✓');
}
function importer(input){
  const file = input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      if(!data.societe || !Array.isArray(data.factures)) throw new Error('format');
      if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')) return;
      DB = migrate(data);
      saveDB(); render(); toast('Sauvegarde importée ✓');
    }catch(e){ toast('Fichier invalide : ce n\u2019est pas une sauvegarde Tijara.', true); }
    input.value = '';
  };
  rd.readAsText(file);
}
function reinitialiser(){
  if(!confirm('⚠ Toutes les données (clients, produits, factures…) seront définitivement effacées. Continuer ?')) return;
  if(!confirm('Dernière confirmation : effacer TOUT ?')) return;
  DB = defaultDB(); saveDB(); render(); toast('Application réinitialisée');
}

/* ---------- Comptes & trésorerie ---------- */
function soldeCompte(id){
  const c = compteById(id); if(!c) return 0;
  let s = Number(c.soldeInitial)||0;
  DB.reglements.forEach(r=>{ if(r.compteId===id && r.statut!=='impayé') s += Number(r.montant)||0; });
  DB.reglementsF.forEach(r=>{ if(r.compteId===id && r.statut!=='impayé') s -= Number(r.montant)||0; });
  DB.charges.forEach(ch=>{ if(ch.compteId===id) s -= Number(ch.montant)||0; });
  return r2(s);
}
function autoCompte(mode){
  const c = $('#r_cpt'); if(!c) return;
  const t = /Espèces/.test(mode) ? 'caisse' : 'banque';
  const cp = DB.comptes.find(x=>x.type===t) || DB.comptes[0];
  if(cp) c.value = cp.id;
}

  const total = DB.comptes.reduce((a,c)=>a+soldeCompte(c.id),0);
  const mvts = [];
  DB.reglements.forEach(r=>{ if(r.statut!=='impayé') mvts.push({date:r.date, lbl:'Encaissement '+(factureById(r.factureId)?.numero||''), m:+r.montant, cpt:r.compteId, mode:r.mode}); });
  DB.reglementsF.forEach(r=>{ if(r.statut!=='impayé') mvts.push({date:r.date, lbl:'Paiement fournisseur '+(fachatById(r.factureId)?.numero||''), m:-r.montant, cpt:r.compteId, mode:r.mode}); });
  DB.charges.forEach(ch=> mvts.push({date:ch.date, lbl:'Charge : '+ch.libelle, m:-ch.montant, cpt:ch.compteId, mode:ch.mode||''}));
  mvts.sort((a,b)=> b.date.localeCompare(a.date));
  return `
  <div class="page-head"><div><h2>Trésorerie &amp; banques</h2><div class="sub">Soldes alimentés par les encaissements, paiements et charges</div></div>
    <button class="btn btn-primary" onclick="editCompte()">+ Ajouter un compte</button></div>
  <div class="chips">
    ${DB.comptes.map(c=>{const s=soldeCompte(c.id); return `<div class="chip">${c.type==='caisse'?'💵':'🏦'} ${esc(c.nom)}<b style="color:${s>=0?'var(--green)':'var(--red)'}">${fmtDH(s)}</b></div>`;}).join('')}
    <div class="chip">Trésorerie totale<b style="color:${total>=0?'var(--green)':'var(--red)'}">${fmtDH(total)}</b></div>
  </div>
  <div class="dash-grid">
    <div class="card">
      <table class="list"><thead><tr><th>Date</th><th>Mouvement</th><th>Compte</th><th>Mode</th><th class="num">Montant</th></tr></thead><tbody>
      ${mvts.slice(0,25).map(m=>`<tr><td>${dfr(m.date)}</td><td>${esc(m.lbl)}</td><td>${esc(compteById(m.cpt)?.nom||'—')}</td>
        <td>${m.mode?`<span class="badge b-blue">${esc(m.mode)}</span>`:'—'}</td>
        <td class="num" style="font-weight:700; color:${m.m>=0?'var(--green)':'var(--red)'}">${m.m>=0?'+':''}${fmt(m.m)}</td></tr>`).join('')
        || '<tr><td colspan="5" class="empty">Aucun mouvement.</td></tr>'}
      </tbody></table>
    </div>
    <div class="card card-pad">
      <h3>Comptes</h3>
      <table class="list"><tbody>
      ${DB.comptes.map(c=>`<tr><td><b>${esc(c.nom)}</b><br><small style="color:var(--muted)">${c.type==='caisse'?'Caisse':'Banque'} · solde initial ${fmt(c.soldeInitial)}</small></td>
        <td class="num"><b>${fmtDH(soldeCompte(c.id))}</b></td>
        <td class="actions"><button class="btn btn-ghost btn-sm" onclick="editCompte('${c.id}')">✎</button>
        <button class="btn btn-ghost btn-sm" style="color:var(--red)" onclick="delCompte('${c.id}')">🗑</button></td></tr>`).join('')}
      </tbody></table>
    </div>
  </div>`;
}
function editCompte(id){
  const c = id ? compteById(id) : {type:'banque', soldeInitial:0};
  openModal((id?'Modifier':'Nouveau')+' compte de trésorerie', `
    <div class="grid3">
      <div class="field" style="grid-column:1/3"><label>Nom du compte <span class="req">*</span></label><input id="c_nom" value="${esc(c.nom||'')}" placeholder="Banque Populaire, Caisse magasin…"></div>

function saveCompte(id){
  const nom = $('#c_nom').value.trim();
  if(!nom) return toast('Le nom est obligatoire.', true);
  const o = {nom, type:$('#c_type').value, soldeInitial:parseFloat($('#c_init').value)||0};
  if(id) Object.assign(compteById(id), o);
  else { o.id = uid(); DB.comptes.push(o); }
  saveDB(); closeModal(); render(); toast('Compte enregistré ✓');
}
function delCompte(id){
  if(DB.comptes.length<=1) return toast('Il faut au moins un compte.', true);
  if(DB.reglements.some(r=>r.compteId===id) || DB.reglementsF.some(r=>r.compteId===id) || DB.charges.some(c=>c.compteId===id))
    return toast('Des mouvements sont liés à ce compte : il ne peut pas être supprimé.', true);
  if(!confirm('Supprimer ce compte ?')) return;
  DB.comptes = DB.comptes.filter(c=>c.id!==id);
  saveDB(); render(); toast('Compte supprimé');
}

function ouvrirSession(){
  const fond = parseFloat($('#cx_fond').value)||0;
  DB.sessions.push({id:uid(), ouverture:new Date().toISOString(), fond:r2(fond)});
  saveDB(); render(); toast('Caisse ouverte ✓');
}
function posAdd(pid){
  const l = ticket.find(x=>x.produitId===pid);
  if(l) l.qte = r2(l.qte+1);
  else { const p = produitById(pid); ticket.push({produitId:pid, designation:p.designation, qte:1, pu:p.prixVente, remise:0, tva:p.tva}); }
  render();
}
function posQte(i, d){
  ticket[i].qte = r2(ticket[i].qte + d);
  if(ticket[i].qte <= 0) ticket.splice(i,1);
  render();
}
function posScan(q){
  q = q.trim(); if(!q) return;
  const p = DB.produits.find(p=> p.codeBarres===q || p.ref===q);
  if(p){ posSearch=''; posAdd(p.id); const el=$('#posQ'); if(el){el.value=''; el.focus();} }
  else toast('Aucun produit avec ce code-barres / référence.', true);
}
function validerTicket(){
  if(!ticket.length) return toast('Le ticket est vide.', true);
  const s = sessionOuverte(); if(!s) return toast('Ouvrez d\u2019abord la caisse.', true);
  let cid = posClient;
  if(!cid){
    let cpt = DB.clients.find(c=>c.comptoir);
    if(!cpt){ cpt = {id:uid(), nom:'Client de passage', comptoir:true}; DB.clients.push(cpt); }
    cid = cpt.id;
  }
  const f = { id:uid(), numero:nextNumero('factures'), date:today(), clientId:cid,
    lignes:JSON.parse(JSON.stringify(ticket)), notes:'Ticket de caisse', echeance:'', rasTaux:0,
    depotId:posDepot||DB.depots[0].id, sessionId:s.id };
  DB.factures.push(f); appliquerStock(f.lignes, -1, f.depotId);
  const ttc = calcDoc(f).ttc;
  const tCpt = /Espèces/.test(posMode) ? 'caisse' : 'banque';
  const cpt = (DB.comptes.find(c=>c.type===tCpt) || DB.comptes[0]).id;
  const reg = { id:uid(), factureId:f.id, date:today(), montant:ttc, mode:posMode, reference:'', compteId:cpt, recu:nextNumero('recus') };
  if(MODES_SUIVIS(posMode)) reg.statut = 'en portefeuille';
  DB.reglements.push(reg);
  const recuM = parseFloat(posRecuMnt)||0;
  const rendu = posMode==='Espèces' && recuM > ttc ? r2(recuM - ttc) : 0;
  saveDB();
  imprimerTicket(f, reg, recuM, rendu);
  ticket = []; posRecuMnt=''; posSearch='';
  render(); toast('Ticket '+f.numero+' encaissé ✓');
}

function cloturerCaisse(){
  const s = sessionOuverte(); if(!s) return;
  const ventes = DB.factures.filter(f=>f.sessionId===s.id);
  const parMode = {};
  ventes.forEach(f=> DB.reglements.filter(r=>r.factureId===f.id).forEach(r=>{
    parMode[r.mode] = r2((parMode[r.mode]||0) + Number(r.montant||0));
  }));
  const especes = parMode['Espèces']||0;
  const attendu = r2(Number(s.fond||0) + especes);
  openModal('Clôture de caisse', `
    <table class="list"><tbody>

function validerCloture(sid, attendu){
  const s = DB.sessions.find(x=>x.id===sid); if(!s) return;
  const compte = parseFloat($('#cx_compte').value)||0;
  s.fermeture = new Date().toISOString();
  s.compte = r2(compte); s.attendu = r2(attendu); s.ecart = r2(compte - attendu);

  toast(s.ecart===0 ? 'Caisse clôturée — aucun écart ✓' : 'Caisse clôturée — écart de '+fmt(s.ecart)+' DH', s.ecart!==0);
}

    </tr>`).join('')}
    </tbody></table>
    <p style="margin-top:10px; font-size:.82rem; color:var(--muted)">Laissez vide les produits non comptés (ils ne seront pas ajustés). La validation ajuste le stock du dépôt et journalise l'inventaire.</p>`,
    `<button class="btn" onclick="closeModal()">Annuler</button>
     <button class="btn btn-primary" onclick="validerInventaire('${dep}')">✓ Valider l'ajustement</button>`, true);

function validerInventaire(dep){
  const lignes = [];
  document.querySelectorAll('.inv_q').forEach(i=>{
    if(i.value==='') return;
    const p = produitById(i.dataset.pid);
    const compte = parseFloat(i.value)||0;
    const theorique = Number(p.stocks?.[dep])||0;
    if(r2(compte-theorique)!==0) lignes.push({produitId:p.id, designation:p.designation, theorique, compte, ecart:r2(compte-theorique)});
  });
  if(!lignes.length){ closeModal(); return toast('Aucun écart constaté — stock conforme ✓'); }
  const valEcart = r2(lignes.reduce((a,l)=> a + l.ecart*(Number(produitById(l.produitId)?.prixAchat)||0), 0));
  if(!confirm(lignes.length+' produit(s) avec écart.\nValeur de l\u2019écart (prix d\u2019achat) : '+fmt(valEcart)+' DH.\nAjuster le stock ?')) return;
  lignes.forEach(l=> setStock(produitById(l.produitId), dep, l.ecart));
  DB.inventaires.push({id:uid(), date:today(), depotId:dep, lignes, valEcart});
  saveDB(); closeModal(); render();
  toast('Inventaire validé — '+lignes.length+' ajustement(s), écart '+fmt(valEcart)+' DH');
}
function imprimerFeuilleComptage(dep){

/* ---------- Sécurité (verrouillage) ---------- */
let ROLE = 'admin';
const VUES_VENDEUR = ['dashboard','caisse','devis','proformas','commandes','factures','avoirs','retours','bl','reglements','clients','produits'];
function hashPw(s){
  let h = 5381;
  for(const ch of String(s)) h = ((h*33) ^ ch.codePointAt(0)) >>> 0;
  return 'h' + h.toString(36) + String(s).length;
}
function initSecurite(){
  if(DB.securite?.actif && DB.securite.admin) afficherVerrou();
  else { appliquerRole(); render(); }
}
function afficherVerrou(){
  let ov = document.getElementById('lockScreen');
  if(!ov){ ov = document.createElement('div'); ov.id = 'lockScreen'; document.body.appendChild(ov); }
  ov.innerHTML = `
    <div class="lock-card">
      <h1>Tijara<span style="color:var(--saffron)">.</span></h1>
      <p>Application verrouillée — ${esc(DB.societe.nom)}</p>
      <input type="password" id="lockPw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter') deverrouiller()">
      <button class="btn btn-accent" onclick="deverrouiller()" style="width:100%; justify-content:center">Déverrouiller</button>
      <p id="lockErr" style="color:#FFB4A8; min-height:1.2em; font-size:.82rem"></p>
    </div>`;
  ov.style.display = 'flex';
  setTimeout(()=>{ const i=document.getElementById('lockPw'); if(i) i.focus(); }, 50);
}
function deverrouiller(){
  const h = hashPw(document.getElementById('lockPw').value);
  if(h === DB.securite.admin) ROLE = 'admin';
  else if(DB.securite.vendeur && h === DB.securite.vendeur) ROLE = 'vendeur';
  else { document.getElementById('lockErr').textContent = 'Mot de passe incorrect.'; return; }
  document.getElementById('lockScreen').style.display = 'none';
  if(ROLE==='vendeur' && !VUES_VENDEUR.includes(currentView)) currentView = 'caisse';
  appliquerRole(); syncNav(); render();
  toast(ROLE==='vendeur' ? 'Session vendeur — accès limité aux ventes et à la caisse.' : 'Bienvenue ✓');
}
function appliquerRole(){
  document.querySelectorAll('#nav button').forEach(b=>{
    b.style.display = (ROLE==='vendeur' && !VUES_VENDEUR.includes(b.dataset.view)) ? 'none' : '';
  });
}
function verrouiller(){ afficherVerrou(); }
function saveSecurite(){
  const actif = $('#sec_actif').checked;
  const adm = $('#sec_admin').value, vnd = $('#sec_vendeur').value;
  if(actif && !adm && !DB.securite.admin) return toast('Définissez le mot de passe administrateur.', true);
  DB.securite.actif = actif;
  if(adm) DB.securite.admin = hashPw(adm);
  if(vnd) DB.securite.vendeur = hashPw(vnd);
  if($('#sec_vendeur_off') && $('#sec_vendeur_off').checked) DB.securite.vendeur = '';
  saveDB(); render(); toast('Sécurité mise à jour ✓');
}


/* ==================================================================
   MODULE PAIE — Législation marocaine 2026 (LF 50-25, CGI, CNSS)
   Barème IR mensuel, CNSS/AMO, frais pro, charges de famille 600 DH,
   prime d'ancienneté (art. 350 Code du travail), HS, bulletins, journal
   ================================================================== */

/* ---------- Calculs de paie ---------- */
function anneesAnciennete(dateEmbauche, periode){
  if(!dateEmbauche) return 0;
  const fin = new Date(periode + '-28');
  return Math.max(0, Math.floor((fin - new Date(dateEmbauche)) / (365.25*864e5)));
}
function tauxAnciennete(annees){
  const cfg = DB.paieConfig;
  for(const b of cfg.anciennete) if(annees >= b.ans) return b.pct;
  return 0;
}
function calcPaie(emp, s){
  const cfg = DB.paieConfig;
  const base = r2((Number(emp.salaireBase)||0) * (Number(s.jours)||26) / 26);
  const tauxH = (Number(emp.salaireBase)||0) / (cfg.hMois||191);
  const anc = tauxAnciennete(anneesAnciennete(emp.dateEmbauche, s.periode));
  const primeAnc = r2(base * anc/100);
  const hs = r2(tauxH * (1.25*(Number(s.hs25)||0) + 1.5*(Number(s.hs50)||0) + 2*(Number(s.hs100)||0)));
  const primesImp = r2(Number(s.primesImp)||0);
  const indemnites = r2(Number(s.indemnites)||0);
  const sbi = r2(base + primeAnc + hs + primesImp);           // salaire brut imposable
  const brutGlobal = r2(sbi + indemnites);
  const cnss = r2(Math.min(sbi, cfg.cnssPlafond) * cfg.cnssSalTaux/100);
  const amo = r2(sbi * cfg.amoSalTaux/100);
  const cimrPct = Math.min(Number(emp.tauxCimr)||0, cfg.cimrMaxPct);
  const cimr = r2(sbi * cimrPct/100);
  const fpBaseM = cfg.fpBase==='net' ? r2(sbi - cnss - amo - cimr) : sbi;
  const fp = sbi <= cfg.fpSeuilM
    ? r2(Math.min(fpBaseM * cfg.fp1Taux/100, cfg.fp1PlafM))
    : r2(Math.min(fpBaseM * cfg.fp2Taux/100, cfg.fp2PlafM));
  const rni = r2(Math.max(0, sbi - cnss - amo - cimr - fp));
  let irBrut = 0;
  for(const t of cfg.bareme){
    if(t.max===null || rni <= t.max){ irBrut = r2(Math.max(0, rni * t.taux/100 - t.somme)); break; }
  }
  const nbF = Math.min(Number(emp.nbCharges)||0, cfg.maxFam);
  const ir = r2(Math.max(0, irBrut - nbF * cfg.chargeFam));
  const avances = r2(Number(s.avances)||0);
  const net = r2(brutGlobal - cnss - amo - cimr - ir - avances);
  const patPS = r2(Math.min(sbi, cfg.cnssPlafond) * cfg.patPS/100);
  const patAF = r2(sbi * cfg.patAF/100);
  const patTFP = r2(sbi * cfg.patTFP/100);
  const patAMO = r2(sbi * cfg.patAMO/100);
  const patronales = r2(patPS + patAF + patTFP + patAMO);
  return { base, anc, primeAnc, hs, primesImp, indemnites, sbi, brutGlobal, cnss, amo, cimrPct, cimr, fp, rni,
    irBrut, chargesFam:r2(nbF*cfg.chargeFam), ir, avances, net, patPS, patAF, patTFP, patAMO, patronales,
    cout:r2(brutGlobal + patronales) };
}

/* ---------- Journal de paie & déclarations ---------- */
function vPaieJournal(){
  const bulletins = DB.paies.filter(b=>b.periode===paieMois);
  const tot = bulletins.reduce((a,b)=>{
    const c = b.calc;
    a.brut+=c.brutGlobal; a.sbi+=c.sbi; a.cnss+=c.cnss; a.amo+=c.amo; a.cimr+=c.cimr; a.ir+=c.ir; a.net+=c.net;
    a.patPS+=c.patPS; a.patAF+=c.patAF; a.patTFP+=c.patTFP; a.patAMO+=c.patAMO; a.cout+=c.cout;
    return a;
  }, {brut:0,sbi:0,cnss:0,amo:0,cimr:0,ir:0,net:0,patPS:0,patAF:0,patTFP:0,patAMO:0,cout:0});
  Object.keys(tot).forEach(k=> tot[k]=r2(tot[k]));
  const cnssAVerser = r2(tot.cnss + tot.amo + tot.patPS + tot.patAF + tot.patTFP + tot.patAMO);
  const dejaComptabilise = DB.charges.some(c=>c.paieMois===paieMois);
  return `
  <div class="toolbar">
    <input type="month" value="${paieMois}" onchange="paieMois=this.value; render()" style="padding:8px 12px; border:1px solid var(--line); border-radius:8px">
    <button class="btn btn-accent" onclick="exportJournalPaie()">⬇ Exporter CSV (Excel)</button>
    <button class="btn ${dejaComptabilise?'':'btn-primary'}" onclick="comptabiliserPaie()" ${dejaComptabilise?'disabled title="Déjà comptabilisé pour ce mois"':''}>
      ${dejaComptabilise?'✓ Comptabilisé en charges':'Comptabiliser le mois en charges'}</button>
  </div>
  <div class="chips">
    <div class="chip">Masse salariale nette<b>${fmtDH(tot.net)}</b></div>
    <div class="chip">CNSS + AMO à verser (Damancom)<b style="color:var(--red)">${fmtDH(cnssAVerser)}</b></div>
    <div class="chip">IR à verser à la DGI (avant fin du mois suivant)<b style="color:var(--red)">${fmtDH(tot.ir)}</b></div>
    <div class="chip">Coût employeur total<b>${fmtDH(tot.cout)}</b></div>
  </div>
  <div class="card">${bulletins.length ? `
    <table class="list"><thead><tr><th>Employé</th><th class="num">Brut</th><th class="num">CNSS</th><th class="num">AMO</th>
      <th class="num">IR</th><th class="num">Net</th><th class="num">Patronales</th><th class="num">Coût</th><th></th></tr></thead><tbody>
    ${bulletins.map(b=>`<tr>
      <td><b>${esc(b.emp.nom)}</b><br><small style="color:var(--muted)">${esc(b.numero)}</small></td>
      <td class="num">${fmt(b.calc.brutGlobal)}</td><td class="num">${fmt(b.calc.cnss)}</td><td class="num">${fmt(b.calc.amo)}</td>
      <td class="num">${fmt(b.calc.ir)}</td><td class="num" style="font-weight:700">${fmt(b.calc.net)}</td>
      <td class="num">${fmt(b.calc.patronales)}</td><td class="num">${fmt(b.calc.cout)}</td>
      <td class="actions"><button class="btn btn-ghost btn-sm" onclick="imprimerBulletin('${b.id}')">🖨</button></td></tr>`).join('')}
    <tr style="background:#F4F7F6; font-weight:800"><td>TOTAUX (${bulletins.length} bulletin(s))</td>
      <td class="num">${fmt(tot.brut)}</td><td class="num">${fmt(tot.cnss)}</td><td class="num">${fmt(tot.amo)}</td>
      <td class="num">${fmt(tot.ir)}</td><td class="num">${fmt(tot.net)}</td>
      <td class="num">${fmt(r2(tot.patPS+tot.patAF+tot.patTFP+tot.patAMO))}</td><td class="num">${fmt(tot.cout)}</td><td></td></tr>
    </tbody></table>` : '<div class="empty">Aucun bulletin établi sur '+paieMois+'. Passez par l\u2019onglet « Bulletins du mois ».</div>'}
  </div>`;
}
function exportJournalPaie(){
  const bulletins = DB.paies.filter(b=>b.periode===paieMois);
  if(!bulletins.length) return toast('Aucun bulletin sur la période.', true);
  const num = v => (Number(v)||0).toFixed(2).replace('.', ',');
  const q = s => '"' + String(s??'').replace(/"/g,'""') + '"';
  const head = ['Employé','CIN','N° CNSS','Jours','Brut imposable','Indemnités exo.','Brut global','CNSS sal.','AMO sal.','CIMR','Frais pro','Net imposable','IR','Avances','NET À PAYER','CNSS pat.','Alloc. fam.','Taxe FP','AMO pat.','Coût employeur','RIB'];
  const lines = [head.join(';')];
  bulletins.forEach(b=>{
    const c=b.calc, e=b.emp;
    lines.push([q(e.nom), q(e.cin), q(e.numCnss), num(b.saisie.jours), num(c.sbi), num(c.indemnites), num(c.brutGlobal),
      num(c.cnss), num(c.amo), num(c.cimr), num(c.fp), num(c.rni), num(c.ir), num(c.avances), num(c.net),
      num(c.patPS), num(c.patAF), num(c.patTFP), num(c.patAMO), num(c.cout), q(e.rib)].join(';'));
  });
  const blob = new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'journal-paie-'+paieMois+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast('Journal de paie exporté ✓');
}
function comptabiliserPaie(){
  const bulletins = DB.paies.filter(b=>b.periode===paieMois);
  if(!bulletins.length) return toast('Aucun bulletin sur la période.', true);
  if(DB.charges.some(c=>c.paieMois===paieMois)) return toast('Ce mois est déjà comptabilisé.', true);
  const cout = r2(bulletins.reduce((a,b)=>a+b.calc.cout,0));
  const cpt = (DB.comptes.find(c=>c.type==='banque')||DB.comptes[0]).id;
  if(!confirm('Enregistrer une charge « Salaires & CNSS » de '+fmt(cout)+' DH (coût employeur total '+paieMois+') ?')) return;
  DB.charges.push({ id:uid(), date:paieMois+'-28', categorie:'Salaires & CNSS',
    libelle:'Masse salariale '+paieMois+' ('+bulletins.length+' bulletin(s))', montant:cout, compteId:cpt, paieMois });
  saveDB(); render(); toast('Masse salariale comptabilisée ✓');
}

/* ---------- Paramètres légaux ---------- */

    <h3>SMIG &amp; cotisations salariales</h3>
    <div class="grid3">
      ${f('pc_smig','SMIG mensuel (DH)',c.smigM)}
      ${f('pc_h','Heures / mois (base HS)',c.hMois,1)}
      ${f('pc_cnss','CNSS salariale (%)',c.cnssSalTaux)}
      ${f('pc_plaf','Plafond CNSS (DH)',c.cnssPlafond)}
      ${f('pc_amo','AMO salariale (%)',c.amoSalTaux)}
      ${f('pc_cimrmax','CIMR déductible max (%)',c.cimrMaxPct)}
    </div>
    <h3 style="margin-top:16px">Cotisations patronales</h3>
    <div class="grid3">
      ${f('pc_ps','Prestations sociales (%)',c.patPS)}
      ${f('pc_af','Allocations familiales (%)',c.patAF)}
      ${f('pc_tfp','Taxe formation prof. (%)',c.patTFP)}
      ${f('pc_amop','AMO patronale (%)',c.patAMO)}
    </div>
    <h3 style="margin-top:16px">Frais professionnels &amp; charges de famille (IR)</h3>
    <div class="grid3">
      ${f('pc_fp1','Taux 1 (%) — bas salaires',c.fp1Taux)}
      ${f('pc_fp1p','Plafond mensuel taux 1 (DH)',c.fp1PlafM)}
      ${f('pc_fps','Seuil mensuel brut (DH)',c.fpSeuilM)}
      ${f('pc_fp2','Taux 2 (%) — au-delà',c.fp2Taux)}
      ${f('pc_fp2p','Plafond mensuel taux 2 (DH)',c.fp2PlafM)}
      ${f('pc_fam','Charge de famille (DH/mois/pers.)',c.chargeFam)}
      <div class="field"><label>Base des frais professionnels</label>
        <select id="pc_fpbase">
          <option value="brut" ${(c.fpBase||'brut')==='brut'?'selected':''}>Brut imposable (CGI art. 59 — recommandé)</option>
          <option value="net" ${c.fpBase==='net'?'selected':''}>Brut − cotisations (pratique de certains cabinets)</option>
        </select></div>
    </div>
    <h3 style="margin-top:16px">Barème IR mensuel (revenu net imposable)</h3>
    <table class="list" style="max-width:560px"><thead><tr><th>Tranche jusqu'à (DH/mois)</th><th class="num">Taux</th><th class="num">Somme à déduire</th></tr></thead><tbody>
      ${c.bareme.map(t=>`<tr><td>${t.max===null?'au-delà':fmt(t.max)}</td><td class="num">${t.taux} %</td><td class="num">${fmt(t.somme)}</td></tr>`).join('')}
    </tbody></table>
    <div style="display:flex; gap:10px; margin-top:16px">
      <button class="btn btn-primary" onclick="savePaieConfig()">Enregistrer les paramètres</button>
      <button class="btn" onclick="if(confirm('Restaurer toutes les valeurs légales 2026 ?')){DB.paieConfig=paieDefauts2026(); saveDB(); render(); toast('Valeurs 2026 restaurées ✓');}">↺ Restaurer les valeurs légales 2026</button>
    </div>
    <p style="margin-top:12px; font-size:.78rem; color:var(--muted)">Prime d'ancienneté légale appliquée automatiquement : ${c.anciennete.slice().reverse().map(a=>a.pct+' % dès '+a.ans+' ans').join(' · ')}. Le barème IR se met à jour via « Restaurer » lors des futures lois de finances (ou sur demande de modification).</p>
  </div>`;
}
function savePaieConfig(){
  const c = DB.paieConfig;
  c.smigM=parseFloat($('#pc_smig').value)||c.smigM; c.hMois=parseFloat($('#pc_h').value)||191;
  c.cnssSalTaux=parseFloat($('#pc_cnss').value)||0; c.cnssPlafond=parseFloat($('#pc_plaf').value)||0;
  c.amoSalTaux=parseFloat($('#pc_amo').value)||0; c.cimrMaxPct=parseFloat($('#pc_cimrmax').value)||0;
  c.patPS=parseFloat($('#pc_ps').value)||0; c.patAF=parseFloat($('#pc_af').value)||0;
  c.patTFP=parseFloat($('#pc_tfp').value)||0; c.patAMO=parseFloat($('#pc_amop').value)||0;
  c.fp1Taux=parseFloat($('#pc_fp1').value)||0; c.fp1PlafM=parseFloat($('#pc_fp1p').value)||0;
  c.fpSeuilM=parseFloat($('#pc_fps').value)||0; c.fp2Taux=parseFloat($('#pc_fp2').value)||0;
  c.fp2PlafM=parseFloat($('#pc_fp2p').value)||0; c.chargeFam=parseFloat($('#pc_fam').value)||0;
  c.fpBase=$('#pc_fpbase').value;
  saveDB(); render(); toast('Paramètres de paie enregistrés ✓');
}

/* ---------- Bulletin imprimable ---------- */
function imprimerBulletin(id){
  const b = DB.paies.find(x=>x.id===id); if(!b) return;
  const e = b.emp, c = b.calc, cfg = DB.paieConfig;
  const anc = anneesAnciennete(e.dateEmbauche, b.periode);
  const lg = (lib, base, taux, gain, ret) => `<tr>
    <td>${lib}</td><td class="num">${base!==''?fmt(base):''}</td><td class="num">${taux||''}</td>
    <td class="num">${gain!==''?fmt(gain):''}</td><td class="num">${ret!==''?fmt(ret):''}</td></tr>`;
  let rows = '';
  rows += lg('Salaire de base ('+fmt(b.saisie.jours)+' j)', e.salaireBase, '', c.base, '');
  if(c.primeAnc) rows += lg('Prime d\u2019ancienneté ('+anc+' ans)', c.base, c.anc+' %', c.primeAnc, '');
  if(c.hs) rows += lg('Heures supplémentaires', '', '', c.hs, '');
  if(c.primesImp) rows += lg('Primes imposables', '', '', c.primesImp, '');
  if(c.indemnites) rows += lg('Indemnités exonérées', '', '', c.indemnites, '');
  rows += lg('CNSS (part salariale)', Math.min(c.sbi,cfg.cnssPlafond), cfg.cnssSalTaux+' %', '', c.cnss);
  rows += lg('AMO (part salariale)', c.sbi, cfg.amoSalTaux+' %', '', c.amo);
  if(c.cimr) rows += lg('CIMR (retraite complémentaire)', c.sbi, c.cimrPct+' %', '', c.cimr);
  rows += lg('Impôt sur le revenu (IR)', c.rni, '', '', c.ir);
  if(c.avances) rows += lg('Avances et acomptes', '', '', '', c.avances);
  $('#printArea').innerHTML = `
  <div class="doc" ${docStyleAttr()}>
    <div class="doc-head">
      ${entetePrint()}
      <div class="doc-title"><h2>Bulletin de paie</h2>
        <p><b>N° ${esc(b.numero)}</b></p>
        <p>Période : <b>${b.periode.split('-').reverse().join('/')}</b></p>
      </div>
    </div>
    <div class="doc-meta">
      <div class="blk">
        <div class="t">Salarié</div>
        <p><b>${esc(e.nom)}</b>${e.poste?' — '+esc(e.poste):''}</p>
        <p>CIN : ${esc(e.cin||'—')} · N° CNSS : ${esc(e.numCnss||'—')}</p>
        <p>Embauche : ${dfr(e.dateEmbauche)||'—'} (${anc} an(s)) · Personnes à charge : ${e.nbCharges||0}</p>
        ${e.rib?`<p>RIB : ${esc(e.rib)}</p>`:''}
      </div>
    </div>
    <table class="doc-lines">
      <colgroup><col><col style="width:90px"><col style="width:70px"><col style="width:95px"><col style="width:95px"></colgroup>
      <thead><tr><th>Rubrique</th><th class="num" style="width:90px">Base</th><th class="num" style="width:70px">Taux</th>
        <th class="num" style="width:95px">Gains</th><th class="num" style="width:95px">Retenues</th></tr></thead>
      <tbody>${rows}
      <tr style="font-weight:800; background:#F2F5F4"><td colspan="3">TOTAUX</td>
        <td class="num">${fmt(c.brutGlobal)}</td><td class="num">${fmt(r2(c.cnss+c.amo+c.cimr+c.ir+c.avances))}</td></tr>
      </tbody>
    </table>
    <div class="doc-tot">
      <div class="row"><span>Frais professionnels déduits (IR)</span><span>${fmt(c.fp)}</span></div>
      <div class="row"><span>Net imposable</span><span>${fmt(c.rni)}</span></div>
      <div class="row grand"><span>NET À PAYER</span><span>${fmt(c.net)} DH</span></div>
    </div>
    <div class="doc-lettres">Arrêté le présent bulletin à la somme nette de : <b>${montantEnLettres(c.net)}</b>.</div>
    <div class="doc-notes"><b>Charges patronales (information)</b> — CNSS ${fmt(c.patPS)} · Allocations familiales ${fmt(c.patAF)} · Taxe FP ${fmt(c.patTFP)} · AMO ${fmt(c.patAMO)} — Coût global employeur : <b>${fmt(c.cout)} DH</b></div>
    <div class="doc-sign">
      <div><b>L'employeur</b><div class="l">${esc(DB.societe.nom)}</div></div>
      <div><b>Le salarié (pour réception)</b><div class="l">&nbsp;</div></div>
    </div>
    ${piedPrint()}
  </div>`;
  window.print();
}
